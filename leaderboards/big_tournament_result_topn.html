<script type="module">
  import { getFlagImg, fmtBestRound, fmtWinrate } from "../common/js/utils.js?v=202606170751";

  // ---------- 辅助函数 ----------
  function toTitleCase(str) {
    return str.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
  }

  // ---------- 常量 ----------
  const ROUND_ORDER = {
    'W': 8,
    'F': 7,
    'SF': 6,
    'QF': 5,
    'R16': 4,
    'R32': 3,
    'R64': 2,
    'R128': 1
  };

  const LEVEL_ORDER = {
    'Grand Slam': 1,
    'WTA1000': 2
  };

  function normalizeLevel(level) {
    if (!level) return '';
    const trimmed = level.trim();
    if (trimmed === 'WTA 1000' || trimmed === 'WTA1000') return 'WTA1000';
    return trimmed;
  }

  function isBigLevel(level) {
    const norm = normalizeLevel(level);
    return norm === 'Grand Slam' || norm === 'WTA1000';
  }

  // ---------- 全局变量 ----------
  let fullData = [];
  let calendarData = [];
  let currentView = 'tournament';
  let currentSelected = null;
  let currentSort = { column: null, direction: 'desc' };

  const viewSelect = document.getElementById('view-select');
  const selectorContainer = document.getElementById('selector-container');
  const tableContainer = document.getElementById('stats-table');

  // ---------- 加载数据 ----------
  async function loadData() {
    try {
      const [statsRes, calendarRes] = await Promise.all([
        fetch('../output/top100_big_tournament_stats.json'),
        fetch('../output/calendar-2026.json')
      ]);
      const statsJson = await statsRes.json();
      fullData = statsJson.data || statsJson;
      const cal = await calendarRes.json();
      calendarData = cal.content || [];
      console.log(`✅ 加载 ${fullData.length} 名球员，${calendarData.length} 个赛事`);

      // 设置更新时间 - 从 JSON 中读取时间戳并转换为浏览器本地时间
      const updateEl = document.getElementById('last-updated');
      if (updateEl && statsJson.last_updated) {
        const date = new Date(statsJson.last_updated * 1000);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        updateEl.textContent = `${t('last_updated')} ${year}-${month}-${day}`;
      }

      initView();
    } catch (err) {
      console.error('❌ 加载失败:', err);
      tableContainer.innerHTML = `<tr><td colspan="8" style="color:#b91c1c; padding:40px; text-align:center;">${t('load_fail')}</td></tr>`;
    }
  }

  // ---------- 初始化 ----------
  function initView() {
    const tourneyList = getSortedTourneyList();
    currentSelected = tourneyList[0]?.name || '';
    currentView = 'tournament';
    viewSelect.value = 'tournament';
    currentSort = { column: null, direction: 'desc' };
    renderSelector();
    renderTable();
  }

  function buildTourneyInfoMap() {
    const map = new Map();
    calendarData.forEach(t => {
      const group = t.tournamentGroup || {};
      const rawName = group.name;
      if (!rawName) return;
      const name = toTitleCase(rawName);

      const level = normalizeLevel(t.level);
      if (!isBigLevel(level)) return;

      const start = t.startDate || '';
      const end = t.endDate || '';
      const surface = t.surface || '';
      const inOut = t.inOutdoor || '';
      const surfaceFull = surface ? `${surface} (${inOut === 'O' ? 'Outdoor' : (inOut === 'I' ? 'Indoor' : '')})` : '';

      if (!map.has(name)) {
        map.set(name, { level, startDate: start, endDate: end, surface: surfaceFull });
      }
    });
    return map;
  }

  function getSortedTourneyList() {
    const infoMap = buildTourneyInfoMap();
    const list = [];
    for (let [name, info] of infoMap.entries()) {
      list.push({ name, ...info });
    }
    list.sort((a, b) => {
      const la = LEVEL_ORDER[a.level] || 99;
      const lb = LEVEL_ORDER[b.level] || 99;
      if (la !== lb) return la - lb;
      return (a.startDate || '').localeCompare(b.startDate || '');
    });
    return list;
  }

  function renderSelector() {
    let html = '';
    if (currentView === 'player') {
      const sorted = [...fullData].sort((a, b) => a.rank - b.rank);
      html = `
          <label for="player-select" class="form-label mb-0 me-1 small text-nowrap">${t("bigTournament_label_player")}</label>
          <select id="player-select" class="form-select form-select-sm">
            ${sorted.map(p => {
        const sel = p.player_name === currentSelected ? 'selected' : '';
        return `<option value="${p.player_name}" ${sel}>#${p.rank} ${p.player_name}</option>`;
      }).join('')}
          </select>
        `;
    } else {
      const tourneyList = getSortedTourneyList();
      if (!currentSelected || !tourneyList.some(t => t.name === currentSelected)) {
        currentSelected = tourneyList[0]?.name || '';
      }
      html = `
          <label for="tourney-select" class="form-label mb-0 me-1 small text-nowrap">${t("bigTournament_label_tournament")}</label>
          <select id="tourney-select" class="form-select form-select-sm">
            ${tourneyList.map(t => {
        const sel = t.name === currentSelected ? 'selected' : '';
        return `<option value="${t.name}" ${sel}>${t.name}</option>`;
      }).join('')}
          </select>
        `;
    }
    selectorContainer.innerHTML = html;

    const selectEl = currentView === 'player'
      ? document.getElementById('player-select')
      : document.getElementById('tourney-select');

    if (selectEl) {
      selectEl.addEventListener('change', (e) => {
        currentSelected = e.target.value;
        currentSort = { column: null, direction: 'desc' };
        renderTable();
      });
    }
  }

  function renderTable() {
    if (currentView === 'player') {
      renderPlayerView();
    } else {
      renderTournamentView();
    }
    bindSortEvents();
  }

  function sortPlayerTournamentsDefault(tournaments) {
    return [...tournaments].sort((a, b) => {
      const la = LEVEL_ORDER[a.level] || 99;
      const lb = LEVEL_ORDER[b.level] || 99;
      if (la !== lb) return la - lb;
      return (a.startDate || '').localeCompare(b.startDate || '');
    });
  }

  function sortTournamentPlayersDefault(players) {
    return [...players].sort((a, b) => a.rank - b.rank);
  }

  function renderPlayerView() {
    const player = fullData.find(p => p.player_name === currentSelected);
    if (!player) return;

    const infoMap = buildTourneyInfoMap();
    const tournaments = player.tournaments
      .filter(t => isBigLevel(t.level))
      .map(t => {
        const calInfo = infoMap.get(t.tourney_name) || {};
        const notPlayed = t.best_round == null;
        return {
          ...t,
          level: normalizeLevel(t.level),
          startDate: calInfo.startDate || '',
          endDate: calInfo.endDate || '',
          surface: calInfo.surface || '',
          W: notPlayed ? -1 : t.W,
          L: notPlayed ? -1 : t.L,
          winrate: notPlayed ? -1 : t.winrate,
          titles: t.titles || (t.best_round === 'W' ? 1 : 0)
        };
      });

    let rows = tournaments;
    if (currentSort.column && currentSort.column !== 'tournament') {
      rows = sortRows(rows, currentSort.column, currentSort.direction);
    } else {
      rows = sortPlayerTournamentsDefault(rows);
    }

    // 添加 colgroup 用于列宽控制
    let html = `
        <colgroup class="player-view">
          <col class="c-no">
          <col class="c-tournament">
          <col class="c-level">
          <col class="c-surface">
          <col class="c-best">
          <col class="c-w">
          <col class="c-l">
          <col class="c-wr">
        </colgroup>
        <thead>
          <tr>
            <th>${t("th_no")}</th>
            <th class="sortable" data-column="tournament">${t("bigTournament_th_tournament")} <span class="sort-indicator"></span></th>
            <th>${t("bigTournament_th_level")}</th>
            <th>${t("bigTournament_th_surface")}</th>
            <th class="sortable" data-column="best_round">${t("bigTournament_th_best_round")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="W">${t("th_w")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="L">${t("th_l")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="winrate">${t("bigTournament_th_win_pct")} <span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody>
      `;

    rows.forEach((t, idx) => {
      const notPlayed = t.best_round == null;
      const titles = t.titles || 1;
      let bestRoundDisplay;
      if (notPlayed) {
        bestRoundDisplay = '—';
      } else {
        bestRoundDisplay = fmtBestRound(t.best_round, titles);
      }

      const wDisplay = notPlayed ? '—' : t.W;
      const lDisplay = notPlayed ? '—' : t.L;
      const wrDisplay = notPlayed ? '—' : fmtWinrate((t.winrate * 100).toFixed(1));
      html += `
          <tr class=\"clickable\" data-player="${currentSelected.replace(/"/g, '&quot;')}" data-tournament="${t.tourney_name.replace(/"/g, '&quot;')}">
            <td class="col-no">${idx + 1}</td>
            <td class="tournament-cell">${t.tourney_name}</td>
            <td>${t.level}</td>
            <td>${t.surface || '—'}</td>
            <td>${bestRoundDisplay}</td>
            <td>${wDisplay}</td>
            <td>${lDisplay}</td>
            <td>${wrDisplay}</td>
          </tr>`;
    });

    // ========== 汇总行 ==========
    const allEvents = player.tournaments.filter(t => isBigLevel(t.level));
    const totalEvents = allEvents.length;
    let totalW = 0, totalL = 0, championCount = 0;
    allEvents.forEach(t => {
      if (t.best_round != null) {
        totalW += t.W;
        totalL += t.L;
        if (t.best_round === 'W') championCount++;
      }
    });
    const totalWR = (totalW + totalL) > 0
      ? (totalW / (totalW + totalL) * 100).toFixed(1)
      : null;

    html += `<tr class="summary-row">
        <td></td>
        <td></td>
        <td colspan="2" style="text-align:right;">
  ${player.player_name}
  <span style="font-weight:400; color:var(--text-muted); font-size:11px;">(${player.dob || '—'})</span>
</td>
        <td>${championCount}/${totalEvents}</td>
        <td>${totalW}</td>
        <td>${totalL}</td>
        <td>${totalWR !== null ? fmtWinrate(totalWR) : '—'}</td>
      </tr>`;

    html += `</tbody>`;
    tableContainer.innerHTML = html;
    highlightSortIndicator();
  }

  function renderTournamentView() {
    const tournamentName = currentSelected;
    const participants = [];

    fullData.forEach(player => {
      const t = player.tournaments.find(t =>
        t.tourney_name === tournamentName && isBigLevel(t.level)
      );
      if (t) {
        const notPlayed = t.best_round == null;
        participants.push({
          rank: player.rank,
          player_name: player.player_name,
          ioc: player.ioc,
          dob: player.dob || '—',
          best_round: t.best_round,
          W: notPlayed ? -1 : t.W,
          L: notPlayed ? -1 : t.L,
          winrate: notPlayed ? -1 : t.winrate,
          titles: t.titles || (t.best_round === 'W' ? 1 : 0)
        });
      }
    });

    let rows = participants;

    if (currentSort.column && currentSort.column !== 'player') {
      rows = sortRows(rows, currentSort.column, currentSort.direction);
    } else {
      rows = sortTournamentPlayersDefault(rows);
    }

    // 添加 colgroup 用于列宽控制
    let html = `
        <colgroup class="tournament-view">
          <col class="c-no">
          <col class="c-player">
          <col class="c-dob">
          <col class="c-best">
          <col class="c-w">
          <col class="c-l">
          <col class="c-wr">
        </colgroup>
        <thead>
          <tr>
            <th>${t("th_no")}</th>
            <th class="sortable" data-column="player">${t("th_player")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="dob">${t("th_dob")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="best_round">${t("bigTournament_th_best_round")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="W">${t("th_w")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="L">${t("th_l")} <span class="sort-indicator"></span></th>
            <th class="sortable" data-column="winrate">${t("bigTournament_th_win_pct")} <span class="sort-indicator"></span></th>
          </tr>
        </thead>
        <tbody>
      `;

    rows.forEach((p, idx) => {
      const notPlayed = p.best_round == null;
      let bestRoundDisplay;
      if (notPlayed) {
        bestRoundDisplay = '—';
      } else {
        const titles = p.titles || 1;
        bestRoundDisplay = fmtBestRound(p.best_round, p.titles);
      }
      const wDisplay = notPlayed ? '—' : p.W;
      const lDisplay = notPlayed ? '—' : p.L;
      const wrDisplay = notPlayed ? '—' : fmtWinrate((p.winrate * 100).toFixed(1));
      html += `
          
            <tr class=\"clickable\" data-player="${p.player_name.replace(/"/g, '&quot;')}" data-tournament="${currentSelected.replace(/"/g, '&quot;')}">
            <td class="col-no">${idx + 1}</td>
            <td class="player-cell">${getFlagImg(p.ioc)} #${p.rank} ${p.player_name}</td>
            <td>${p.dob}</td>
            <td>${bestRoundDisplay}</td>
            <td>${wDisplay}</td>
            <td>${lDisplay}</td>
            <td>${wrDisplay}</td>
          </tr>`;
    });

    if (rows.length === 0) {
      html += `<tr><td colspan="7" style="padding:20px; text-align:center; color:var(--text-muted);">${t("bigTournament_no_players")}</td></tr>`;
    }

    html += `</tbody>`;
    tableContainer.innerHTML = html;
    highlightSortIndicator();
  }

  function sortRows(rows, column, direction) {
    const sorted = [...rows];
    sorted.sort((a, b) => {
      let valA = a[column];
      let valB = b[column];

      if (column === 'best_round') {
        const orderA = ROUND_ORDER[valA] || 0;
        const orderB = ROUND_ORDER[valB] || 0;
        if (orderA !== orderB) {
          return direction === 'asc' ? orderA - orderB : orderB - orderA;
        }
        const titlesA = a.titles || 0;
        const titlesB = b.titles || 0;
        if (titlesA !== titlesB) {
          return direction === 'asc' ? titlesA - titlesB : titlesB - titlesA;
        }
        const wrA = a.winrate ?? -1;
        const wrB = b.winrate ?? -1;
        return wrB - wrA;
      }

      if (typeof valA === 'number' && typeof valB === 'number') {
        return direction === 'asc' ? valA - valB : valB - valA;
      }

      const strA = String(valA || '');
      const strB = String(valB || '');
      return direction === 'asc'
        ? strA.localeCompare(strB)
        : strB.localeCompare(strA);
    });
    return sorted;
  }

  function bindSortEvents() {
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', (e) => {
        const column = th.dataset.column;
        if (!column) return;

        if (column === 'tournament' || column === 'player') {
          currentSort = { column: null, direction: 'desc' };
        } else {
          if (currentSort.column === column) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
          } else {
            currentSort.column = column;
            currentSort.direction = 'desc';
          }
        }
        renderTable();
      });
    });
  }

  function highlightSortIndicator() {
    document.querySelectorAll('th.sortable').forEach(th => {
      const span = th.querySelector('.sort-indicator');
      if (!span) return;
      const col = th.dataset.column;
      if (currentSort.column && currentSort.column === col && col !== 'tournament' && col !== 'player') {
        span.textContent = currentSort.direction === 'asc' ? ' ▲' : ' ▼';
      } else {
        span.textContent = '';
      }
    });
  }

  // ---------- 切换视图 ----------
  viewSelect.addEventListener('change', (e) => {
    currentView = e.target.value;
    currentSort = { column: null, direction: 'desc' };
    if (currentView === 'player') {
      const sorted = [...fullData].sort((a, b) => a.rank - b.rank);
      currentSelected = sorted[0]?.player_name || '';
    } else {
      const list = getSortedTourneyList();
      currentSelected = list[0]?.name || '';
    }
    renderSelector();
    renderTable();
  });

  // 启动
  loadData();

  // 语言切换时重新渲染表格（表头在 JS 模板里，需重渲）
  document.addEventListener('langchange', () => {
    document.title = t('bigTournament_page_title');
    renderSelector();
    if (currentView === 'player') renderPlayerView();
    else renderTournamentView();
  });
  // ===== 历史成绩 Modal =====

  const HIST_ROUND_ORDER = ['F', 'SF', 'QF', 'R16', 'R32', 'R64', 'R128'];

  function openHistModal(player, tournament) {
    const backdrop = document.getElementById('hist-modal-backdrop');
    const titleEl = document.getElementById('hist-modal-title');
    const subEl = document.getElementById('hist-modal-sub');
    const contentEl = document.getElementById('hist-content');
    const noDataEl = document.getElementById('hist-no-data');
    const closeBtnEl = document.getElementById('hist-modal-close-btn');

    titleEl.textContent = `${player} · ${tournament} ${window.t('bigTournament_modal_title_suffix')}`;
    subEl.textContent = window.t('bigTournament_modal_loading');
    contentEl.innerHTML = '';
    noDataEl.style.display = 'none';
    closeBtnEl.textContent = window.t('bigTournament_modal_close');
    backdrop.classList.add('open');

    fetch(`/api/player_tournament_history?player=${encodeURIComponent(player)}&tournament=${encodeURIComponent(tournament)}`)
      .then(r => r.json())
      .then(data => {
        if (data.error || !data.matches || data.matches.length === 0) {
          noDataEl.textContent = window.t('bigTournament_modal_no_data');
          noDataEl.style.display = 'block';
          subEl.textContent = '';
          return;
        }

        const matches = data.matches;
        const wins = matches.filter(m => m.result === 'W').length;
        const losses = matches.filter(m => m.result === 'L').length;
        const years = [...new Set(matches.map(m => m.year))];
        const yearMin = Math.min(...years);
        const yearMax = Math.max(...years);
        const winRate = (wins + losses) > 0 ? (wins / (wins + losses) * 100).toFixed(1) : '0.0';
subEl.textContent = `${matches.length} ${window.t('bigTournament_modal_matches')} · ${window.t('modal_winrate')} ${winRate}% (${wins}${window.t('th_w')} ${losses}${window.t('th_l')}) · ${yearMin}–${yearMax}`;

        // 按年份分组
        const byYear = {};
        matches.forEach(m => {
          if (!byYear[m.year]) byYear[m.year] = [];
          byYear[m.year].push(m);
        });

        // 每年内按轮次深→浅排列
        Object.values(byYear).forEach(group => {
          group.sort((a, b) => HIST_ROUND_ORDER.indexOf(a.round) - HIST_ROUND_ORDER.indexOf(b.round));
        });

        // 年份降序
        const sortedYears = Object.keys(byYear).map(Number).sort((a, b) => b - a);

        let html = `<table class="hist-tbl" style="table-layout:fixed;width:100%">
  <colgroup>
    <col style="width:48px">
    <col style="width:40px">
    <col>
    <col style="width:100px">
  </colgroup>
  <thead>
    <tr>
      <td class="tleft">${window.t('bigTournament_modal_round')}</td>
      <td style="text-align:center">${window.t('bigTournament_modal_result')}</td>
      <td class="tleft">${window.t('bigTournament_modal_opponent')}</td>
      <td style="text-align:center">${window.t('bigTournament_modal_score')}</td>
    </tr>
  </thead>`;

sortedYears.forEach(year => {
  const group = byYear[year];
  const fm = group[0];
  const rankEntry = group.find(m => m.winner_name === player || m.loser_name === player);
  const playerRankThisYear = rankEntry
    ? (rankEntry.winner_name === player ? rankEntry.winner_rank : rankEntry.loser_rank)
    : null;
  const rankTag = playerRankThisYear ? `#${playerRankThisYear} ${player}` : player;

  html += `<tbody>
    <tr class="hist-yr-row">
      <td colspan="4">
        <div class="hist-yr-hdr" style="margin:0;padding:8px 0 6px 0">
          <span class="hist-yr-label">${year}</span>
          <span class="hist-yr-meta">${rankTag}</span>
        </div>
      </td>
    </tr>`;

  group.forEach(m => {
    const isWin = m.result === 'W';
    const opponent = m.winner_name === player ? m.loser_name : m.winner_name;
    const oppRank = m.winner_name === player ? m.loser_rank : m.winner_rank;
    const oppStr = oppRank ? `#${oppRank} ${opponent}` : opponent;

    html += `<tr>
      <td class="tleft"><span class="hist-rd">${m.round}</span></td>
      <td style="text-align:center"><span class="${isWin ? 'hist-badge-w' : 'hist-badge-l'}">${m.result}</span></td>
      <td class="tleft bold" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${oppStr}</td>
      <td class="hist-score" style="text-align:center">${m.score || '—'}</td>
    </tr>`;
  });

  html += `</tbody>`;
});

html += `</table>`;
contentEl.innerHTML = html;
      })
      .catch(() => {
        noDataEl.textContent = window.t('bigTournament_modal_no_data');
        noDataEl.style.display = 'block';
        subEl.textContent = '';
      });
  }

  // 关闭 Modal
  function closeHistModal() {
    document.getElementById('hist-modal-backdrop').classList.remove('open');
  }
  document.getElementById('hist-modal-close').addEventListener('click', closeHistModal);
  document.getElementById('hist-modal-close-btn').addEventListener('click', closeHistModal);
  document.getElementById('hist-modal-backdrop').addEventListener('click', function (e) {
    if (e.target === this) closeHistModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeHistModal();
  });
  // 表格行双击事件委托
document.getElementById('stats-table').addEventListener('dblclick', function(e) {
  const tr = e.target.closest('tr.clickable');
  if (!tr) return;
  const player = tr.dataset.player;
  const tournament = tr.dataset.tournament;
  if (player && tournament) openHistModal(player, tournament);
});



</script>

<!-- 历史成绩 Modal -->
<div id="hist-modal-backdrop">
  <div id="hist-modal">
    <div id="hist-modal-header">
      <div>
        <div id="hist-modal-title"></div>
        <div id="hist-modal-sub"></div>
      </div>
      <button id="hist-modal-close">✕</button>
    </div>
    <div id="hist-modal-body">
      <div id="hist-no-data" style="display:none"></div>
      <div id="hist-content"></div>
    </div>
    <div id="hist-modal-footer">
      <button id="hist-modal-close-btn"></button>
    </div>
  </div>
</div>
</body>

</html>
