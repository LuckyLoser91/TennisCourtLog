<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>2026 Rome WTA 1000 - 签表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --clay:       #c4572a;   /* Roman terracotta */
            --clay-dark:  #9b3f1a;
            --clay-light: #e8845a;
            --earth:      #1e2b1f;   /* deep olive-black */
            --earth-mid:  #2d4030;
            --earth-soft: #3d5543;
            --cream:      #f7f0e6;   /* warm paper */
            --cream-dark: #ede3d5;
            --gold:       #d4a843;
            --text-dark:  #1a1208;
            --text-mid:   #5a4a3a;
            --text-light: #9a8878;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background-color: var(--earth);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(196,87,42,0.18) 0%, transparent 60%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 39px,
                    rgba(255,255,255,0.015) 39px,
                    rgba(255,255,255,0.015) 40px
                );
            min-height: 100vh;
            padding: 0 0 60px;
            color: var(--text-dark);
        }

        /* ── Header ── */
        .header {
            text-align: center;
            padding: 36px 20px 28px;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .header-eyebrow {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.7em;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--clay-light);
            margin-bottom: 10px;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2em, 5vw, 3.4em);
            font-weight: 700;
            color: var(--cream);
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .header h1 .city {
            color: var(--clay-light);
        }

        .header-sub {
            margin-top: 8px;
            font-size: 0.82em;
            font-weight: 300;
            color: rgba(247,240,230,0.55);
            letter-spacing: 0.06em;
        }

        .header-divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--clay), transparent);
            margin: 14px auto 0;
        }

        /* ── Tabs ── */
        .tabs-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--earth-mid);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            justify-content: flex-start;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 0 16px;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            flex-shrink: 0;
            padding: 13px 18px;
            background: transparent;
            color: rgba(247,240,230,0.45);
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8em;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--cream);
        }

        .tab.active {
            color: var(--clay-light);
            border-bottom-color: var(--clay);
            font-weight: 600;
        }

        /* ── Bracket container ── */
        .bracket-container {
            overflow: auto;
            padding: 28px 40px 40px;
            display: flex;
            justify-content: center;
            cursor: grab;
            max-height: 82vh;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            .bracket-container {
                justify-content: flex-start;
                padding: 16px 16px 40px;
                max-height: none;
            }
        }

        .bracket-container:active { cursor: grabbing; }
        .bracket-container.dragging { cursor: grabbing; user-select: none; }

        /* ── Bracket layout ── */
        .bracket {
            display: flex;
            gap: 0;
            align-items: flex-start;
        }

        .round-col {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .round-header {
            text-align: center;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.65em;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(247,240,230,0.4);
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 6px 0 6px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .round-matches-area { position: relative; }

        /* ── Match card ── */
        .match {
            background: var(--cream);
            border-radius: 4px;
            overflow: hidden;
            border-left: 3px solid var(--earth-soft);
            display: flex;
            flex-direction: column;
            position: absolute;
            transition: box-shadow 0.15s, transform 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25), 0 3px 12px rgba(0,0,0,0.15);
        }

        .match:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
            transform: translateY(-1px);
            z-index: 10;
        }

        .match.finished {
            border-left-color: var(--clay);
        }

        /* ── Player rows ── */
        .player {
            padding: 5px 10px 4px;
            display: flex;
            align-items: center;
            flex: 1;
            min-height: 0;
            background: var(--cream);
        }

        .player + .player {
            border-top: 1px solid var(--cream-dark);
        }

        .player.winner {
            background: linear-gradient(90deg, #f2e8dc 0%, var(--cream) 100%);
        }

        .player.winner .player-name {
            color: var(--clay-dark);
            font-weight: 600;
        }

        .winner-badge {
            flex-shrink: 0;
            margin-left: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--clay);
            color: white;
            font-size: 0.55em;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-name {
            font-size: 0.82em;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.3;
            color: var(--text-dark);
        }

        .player-name .seed {
            font-size: 0.8em;
            color: var(--clay);
            font-weight: 600;
        }

        .player-rank {
            font-size: 0.7em;
            color: var(--text-light);
            font-weight: 500;
            min-width: 24px;
            display: inline-block;
            flex-shrink: 0;
        }

        .player-flag {
            width: 15px;
            height: 11px;
            border-radius: 1px;
            flex-shrink: 0;
            box-shadow: 0 0 0 0.5px rgba(0,0,0,0.15);
        }

        .rome-stats {
            font-size: 0.6em;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            line-height: 1.2;
            padding-left: 46px;
        }

        /* ── Round badges ── */
        .best-round-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.9em;
            color: white;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }

        .best-round-R128 { background: #8a8a8a; }
        .best-round-R64  { background: #7a6355; }
        .best-round-R32  { background: #3d7eb5; }
        .best-round-R16  { background: #2a9d8f; }
        .best-round-QF   { background: #6b3fa0; }
        .best-round-SF   { background: #d4870a; }
        .best-round-F    { background: #c0392b; }
        .best-round-W    { background: linear-gradient(135deg, #c9a227, #e07b00); color: #fff; }

        .wl-record {
            font-weight: 400;
            color: var(--text-light);
        }

        /* ── Winrate badges ── */
        .winrate-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .winrate-badge.high   { background: #dff0e4; color: #1e7a3c; }
        .winrate-badge.medium { background: #fdf3e0; color: #b07a00; }
        .winrate-badge.low    { background: #fce8e6; color: #b33020; }

        .no-data-badge {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.88em;
            color: #6a85a8;
            background: #eaf0f8;
            font-style: italic;
            white-space: nowrap;
        }

        .no-data-badge::before { content: '✦ '; font-style: normal; font-size: 0.8em; }

        .bye, .tbd, .placeholder {
            color: var(--text-light);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-eyebrow">WTA 1000 · Internazionali BNL d'Italia</div>
        <h1>Rome, <span class="city">Italy</span></h1>
        <div class="header-sub">2026 · 球员在罗马赛事的历史战绩</div>
        <div class="header-divider"></div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs" id="tabs">
            <button class="tab active" onclick="showAll()">全部签表</button>
        </div>
    </div>

    <div class="bracket-container" id="bracketContainer">
        <div class="bracket" id="bracket"></div>
    </div>

    <script>
        const bestRoundLabels = {
            'R128': 'R128', 'R64': 'R64', 'R32': 'R32', 'R16': 'R16',
            'QF': 'QF', 'SF': 'SF', 'F': 'F', 'W': 'W'
        };

        const allRoundOrder = [
            'Round of 128', 'Round of 64', 'Round of 32',
            'Round of 16', 'Quarterfinal', 'Semifinal', 'Final'
        ];

        // Full bracket: how many blocks per round (for placeholder pre-rendering)
        const fullBlocksPerRound = [64, 32, 16, 8, 4, 2, 1];

        function getBestRoundClass(r) { return r ? 'best-round-' + r : ''; }

        function formatTitles(titles) {
            if (!titles || titles === '0' || titles === 'false' || titles === false) return '';
            const count = parseInt(titles);
            return count > 0 ? ` 🏆×${count}` : '';
        }

        function getFlagImg(iso2) {
            if (!iso2) return '';
            return `<img class="player-flag" src="https://flagcdn.com/16x12/${iso2.toLowerCase()}.png" alt="${iso2}">`;
        }

        function hasValidRanking(player) {
            return player.ranking && player.ranking !== '-' && !isNaN(player.ranking) && parseInt(player.ranking) > 0;
        }

        function getR128Section(roundIndex, blockOrder) {
            if (roundIndex === 0) return Math.ceil(blockOrder / 8);
            const multiplier = Math.pow(2, roundIndex);
            const r128StartOrder = (blockOrder - 1) * multiplier + 1;
            const r128EndOrder = blockOrder * multiplier;
            const startSection = Math.ceil(r128StartOrder / 8);
            const endSection = Math.ceil(r128EndOrder / 8);
            if (startSection !== endSection) return null;
            return startSection;
        }

        function buildPlayerHTML(player) {
            const isWinner = player.winner === true;
            const seed = player.teamSeed ? `[${player.teamSeed}]` : '';
            const isValidPlayer = hasValidRanking(player);

            let romeStats = '';
            if (!isValidPlayer) {
                romeStats = '<div class="rome-stats" style="visibility:hidden;height:1.2em;">-</div>';
            } else if (player.best_round && (player.W !== '' && player.W !== '0' || player.L !== '' && player.L !== '0')) {
                const winrate = parseFloat(player.winrate) || 0;
                const winratePct = (winrate * 100).toFixed(0);
                let winrateClass = winrate >= 0.6 ? 'high' : winrate >= 0.4 ? 'medium' : 'low';
                romeStats = `<div class="rome-stats">
                    <span class="best-round-badge ${getBestRoundClass(player.best_round)}">${bestRoundLabels[player.best_round] || player.best_round}${formatTitles(player.titles)}</span>
                    <span class="winrate-badge ${winrateClass}">${winratePct}%</span>
                    <span class="wl-record">W-L: ${player.W || 0}-${player.L || 0}</span>
                </div>`;
            } else {
                romeStats = `<div class="rome-stats"><span class="no-data-badge">Rome Debut</span></div>`;
            }

            const winnerClass = isWinner ? 'winner' : '';
            const flagImg = isValidPlayer ? getFlagImg(player.iso2) : '';
            const rankDisplay = isValidPlayer ? `<span class="player-rank">#${player.ranking}</span>` : '';
            const nameClass = !isValidPlayer ? 'placeholder' : '';

            return `<div class="player ${winnerClass}">
                <div class="player-info">
                    <div class="player-name ${nameClass}">
                        ${rankDisplay}${flagImg}${player.name}<span class="seed">${seed}</span>
                        ${isWinner ? '<span class="winner-badge">W</span>' : ''}
                    </div>
                    ${romeStats}
                </div>
            </div>`;
        }

        function buildPlaceholderBlock() {
            // A ghost block for rounds not yet played
            const ghost = (name) => `<div class="player">
                <div class="player-info">
                    <div class="player-name placeholder">${name}</div>
                    <div class="rome-stats" style="visibility:hidden;height:1.2em;">-</div>
                </div>
            </div>`;
            return ghost('TBD') + ghost('TBD');
        }

        // ── Tennis bracket layout constants ───────────────────────────────────
        const MATCH_H  = 100;   // height of one match card
        const BLOCK_GAP = 12;   // visible gap between blocks in the same round
        const MATCH_W  = 260;   // width of one match card
        const SVG_W    = 56;    // width of the connector SVG column
        const HEADER_H = 44;    // height of round title row
        const MARGIN_TOP = 10;  // top padding inside match area

        /**
         * Compute layout parameters for a given number of blocks in the first (densest) round.
         * spacing[r] = slot height per block in round r
         * totalH = total height of the match area
         */
        function computeLayout(firstCount) {
            // Slot = MATCH_H + BLOCK_GAP for first round, doubles each round
            const firstSlot = MATCH_H + BLOCK_GAP;
            // Total height = firstCount * firstSlot
            const totalH = firstCount * firstSlot + MARGIN_TOP;
            return { firstSlot, totalH };
        }

        /**
         * Render a complete bracket into `containerEl`.
         * roundsData: [{roundName, blocks: [...]}]
         *   - blocks can contain real or placeholder blocks
         */
        function renderTennisBracket(containerEl, roundsData) {
            containerEl.innerHTML = '';
            if (roundsData.length === 0) return;

            const blockCounts = roundsData.map(rd => rd.blocks.length);
            const firstCount = blockCounts[0];
            const { firstSlot, totalH } = computeLayout(firstCount);

            // slot per block for each round (doubles as rounds halve)
            const slots = blockCounts.map(c => (firstCount / c) * firstSlot);

            roundsData.forEach((rd, colIdx) => {
                const slot = slots[colIdx];
                const count = rd.blocks.length;

                // Column
                const col = document.createElement('div');
                col.className = 'round-col';
                col.style.width = MATCH_W + 'px';

                // Header
                const hdr = document.createElement('div');
                hdr.className = 'round-header';
                hdr.textContent = rd.roundName;
                hdr.style.width = MATCH_W + 'px';
                col.appendChild(hdr);

                // Match area
                const area = document.createElement('div');
                area.className = 'round-matches-area';
                area.style.cssText = `width:${MATCH_W}px;height:${totalH}px;position:relative;`;

                rd.blocks.forEach((block, bi) => {
                    // Center of slot bi
                    const slotCenter = MARGIN_TOP + bi * slot + slot / 2;
                    const topOffset = slotCenter - MATCH_H / 2;

                    const matchEl = document.createElement('div');
                    matchEl.className = 'match' + (block.finished ? ' finished' : '') + (block.placeholder ? ' placeholder-block' : '');
                    matchEl.style.cssText = `left:0;top:${topOffset}px;width:${MATCH_W}px;height:${MATCH_H}px;`;

                    if (block.placeholder) {
                        matchEl.innerHTML = buildPlaceholderBlock();
                        matchEl.style.opacity = '0.35';
                        matchEl.style.borderLeftColor = 'rgba(255,255,255,0.15)';
                    } else {
                        matchEl.innerHTML = block.participants.map(buildPlayerHTML).join('');
                    }
                    area.appendChild(matchEl);
                });

                col.appendChild(area);
                containerEl.appendChild(col);

                // Connector SVG to next round
                if (colIdx < roundsData.length - 1) {
                    const nextSlot = slots[colIdx + 1];
                    const nextCount = blockCounts[colIdx + 1];

                    const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svgEl.setAttribute('width', SVG_W);
                    svgEl.setAttribute('height', totalH + HEADER_H);
                    svgEl.style.cssText = 'flex-shrink:0;display:block;';

                    const stroke = 'rgba(196,87,42,0.5)';
                    const sw = 1.5;

                    for (let ni = 0; ni < nextCount; ni++) {
                        const si1 = 2 * ni;
                        const si2 = 2 * ni + 1;

                        const y1   = HEADER_H + MARGIN_TOP + si1 * slot + slot / 2;
                        const y2   = HEADER_H + MARGIN_TOP + si2 * slot + slot / 2;
                        const yNext = HEADER_H + MARGIN_TOP + ni * nextSlot + nextSlot / 2;
                        const yMid  = (y1 + y2) / 2;

                        const xMid = SVG_W / 2;

                        // Horizontal right from match1 and match2
                        addLine(svgEl, 0, y1, xMid, y1, stroke, sw);
                        addLine(svgEl, 0, y2, xMid, y2, stroke, sw);
                        // Vertical bracket
                        addLine(svgEl, xMid, y1, xMid, y2, stroke, sw);
                        // Horizontal to next round at midpoint
                        addLine(svgEl, xMid, yMid, SVG_W, yMid, stroke, sw);
                        // If yMid ≠ yNext, connect vertically then horizontally
                        if (Math.abs(yMid - yNext) > 1) {
                            addLine(svgEl, SVG_W - 1, yMid, SVG_W - 1, yNext, stroke, sw);
                        }
                    }

                    containerEl.appendChild(svgEl);
                }
            });
        }

        function addLine(svgEl, x1, y1, x2, y2, stroke, sw) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            line.setAttribute('stroke', stroke);
            line.setAttribute('stroke-width', sw);
            svgEl.appendChild(line);
        }

        // ── Tab & render helpers ─────────────────────────────────────────────

        let activeTabMode = 'all'; // 'all' | 1..8 | 'qf'

        function setupTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';

            const addTab = (label, onclick, id) => {
                const btn = document.createElement('button');
                btn.className = 'tab';
                if (id) btn.id = id;
                btn.textContent = label;
                btn.onclick = onclick;
                tabsContainer.appendChild(btn);
                return btn;
            };

            addTab('全部签表', () => switchTab('all'), 'tab-all');
            for (let i = 1; i <= 8; i++) {
                addTab(`${i}/8 区`, () => switchTab(i), `tab-sec-${i}`);
            }
            addTab('🏅 八强', () => switchTab('qf'), 'tab-qf');

            switchTab('all');
        }

        function switchTab(mode) {
            activeTabMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const idMap = { all: 'tab-all', qf: 'tab-qf' };
            const targetId = typeof mode === 'number' ? `tab-sec-${mode}` : idMap[mode];
            const targetEl = document.getElementById(targetId);
            if (targetEl) targetEl.classList.add('active');
            renderBracket(window.drawData, mode);
        }

        /**
         * Build roundsData array including placeholder blocks for future rounds.
         * mode: 'all' | 1..8 | 'qf'
         */
        function buildRoundsData(data, mode) {
            const currentRound = data.currentRound || 1;

            let roundSlice, blocksPerSection;
            if (mode === 'qf') {
                // QF bracket: always show QF → Final (3 rounds), all as placeholders if needed
                roundSlice = allRoundOrder.slice(4); // QF, SF, Final
                blocksPerSection = [4, 2, 1];
            } else if (mode === 'all') {
                roundSlice = allRoundOrder.slice(0, Math.max(currentRound, 1));
                blocksPerSection = fullBlocksPerRound.slice(0, roundSlice.length);
            } else {
                // 1/8 section: always show R128→R16 (4 rounds)
                roundSlice = allRoundOrder.slice(0, 4);
                blocksPerSection = [8, 4, 2, 1];
            }

            const roundsData = [];

            roundSlice.forEach((roundName, ri) => {
                const roundData = data.rounds.find(r => r.description === roundName);
                const roundIndex = roundData ? data.rounds.indexOf(roundData) : -1;

                let realBlocks = [];
                if (roundData) {
                    realBlocks = [...roundData.blocks].sort((a, b) => a.order - b.order);
                    if (typeof mode === 'number') {
                        realBlocks = realBlocks.filter(b => getR128Section(roundIndex, b.order) === mode);
                    } else if (mode === 'qf') {
                        // no section filter for qf
                    }
                }

                const expectedCount = blocksPerSection[ri];
                const blocks = [];

                for (let i = 0; i < expectedCount; i++) {
                    if (i < realBlocks.length) {
                        blocks.push(realBlocks[i]);
                    } else {
                        blocks.push({ placeholder: true, order: i + 1, finished: false, participants: [] });
                    }
                }

                if (blocks.length > 0) {
                    roundsData.push({ roundName, blocks });
                }
            });

            return roundsData;
        }

        function renderBracket(data, mode) {
            const bracketEl = document.getElementById('bracket');
            const roundsData = buildRoundsData(data, mode);
            renderTennisBracket(bracketEl, roundsData);
        }

        function fetchAndRender() {
            fetch('../output/draw_rome_2026_with_history_stats.json?v=202605060741')
                .then(r => r.json())
                .then(data => {
                    window.drawData = data;
                    window.currentRound = data.currentRound || 1;
                    setupTabs();
                    enableDragScroll();
                });
        }

        function enableDragScroll() {
            const container = document.getElementById('bracketContainer');
            if (!container) return;
            let isDown = false, startX, startY, scrollLeft, scrollTop;
            container.addEventListener('mousedown', e => {
                isDown = true; container.classList.add('dragging');
                startX = e.pageX - container.offsetLeft; startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft; scrollTop = container.scrollTop;
            });
            container.addEventListener('mouseleave', () => { isDown = false; container.classList.remove('dragging'); });
            container.addEventListener('mouseup', () => { isDown = false; container.classList.remove('dragging'); });
            container.addEventListener('mousemove', e => {
                if (!isDown) return; e.preventDefault();
                container.scrollLeft = scrollLeft - (e.pageX - container.offsetLeft - startX) * 2;
                container.scrollTop = scrollTop - (e.pageY - container.offsetTop - startY) * 2;
            });
            container.addEventListener('dragstart', e => e.preventDefault());
        }

        fetchAndRender();
    </script>
</body>

</html>
