    <script type="module">
      import {
        getFlagImg,
        fmtAge,
        fmtWinrate,
      } from "../common/js/utils.js?v=202606170751";

      let dataMap = {};
      let currentTour = "wta";
      let currentAge = null;
      let minAge = 18,
        maxAge = 45;
      let countryChampionCount = new Map();
      let countryTotalTitles = new Map();

      /* ---- 新 TITLES 配色 ---- */
      function titlesCls(n) {
        if (n >= 10) return "titles-cell titles-10";
        if (n >= 5) return "titles-cell titles-5";
        if (n >= 2) return "titles-cell titles-2";
        return "titles-cell titles-1";
      }

      // 与 utils.js 的 fmtRound/fmtBestRound 保持一致的轮次→等级映射
      const RANK_LABEL_JS = { 1: "R128", 2: "R64", 3: "R32", 4: "R16", 5: "QF", 6: "SF", 7: "F", 8: "W" };

      /* ---- 大满贯明细子列（AO/RG/WIM/USO）单元格：复用全站统一的 result-W/F/SF/QF 配色 ---- */
      function slamCellHtml(pd, slam) {
        const entry = pd && pd.slam_breakdown ? pd.slam_breakdown[slam] : null;
        if (!entry || !entry.rank) {
          return `<span class="result-other">—</span>`;
        }
        const label = RANK_LABEL_JS[entry.rank];
        if (label === "W") return `<span class="slam-cell result-W">${entry.display}</span>`;
        if (label === "F") return `<span class="slam-cell result-F">${entry.display}</span>`;
        if (label === "SF") return `<span class="slam-cell result-SF">${entry.display}</span>`;
        if (label === "QF") return `<span class="slam-cell result-QF">${entry.display}</span>`;
        // R16 及以下：普通样式，不特殊着色
        return `<span class="result-other">${entry.display}</span>`;
      }

      /* ---- 新 WINRATE 配色 ---- */
      function aggCls(pct) {
        if (pct == null) return "wr-cell agg-no";
        if (pct >= 90) return "wr-cell agg-90";
        if (pct >= 85) return "wr-cell agg-85";
        if (pct >= 80) return "wr-cell agg-80";
        if (pct >= 75) return "wr-cell agg-75";
        if (pct >= 70) return "wr-cell agg-70";
        return "wr-cell agg-no";
      }
      function surfCls(pct) {
        if (pct == null) return "wr-cell surf-no";
        if (pct >= 90) return "wr-cell surf-90";
        if (pct >= 85) return "wr-cell surf-85";
        if (pct >= 80) return "wr-cell surf-80";
        if (pct >= 75) return "wr-cell surf-75";
        if (pct >= 70) return "wr-cell surf-70";
        return "wr-cell surf-no";
      }

      /* ---- 脚注图例 ---- */
      function buildFooterLegend() {
        const dots = [
          ["#1e3a8a", "#dbeafe", "≥2"],
          ["#3f6212", "#ecfccb", "≥5"],
          ["#92400e", "#fef3c7", "≥10"],
        ];
        const wrDots = [
          ["#ca8a04", "≥70%"],
          ["#65a30d", "≥75%"],
          ["#16a34a", "≥80%"],
          ["#0d9488", "≥85%"],
          ["#0f766e", "≥90%"],
        ];
        const titlesHtml = dots
          .map(([bg, fg, label]) =>
            `${label}<span class="legend-dot" style="background:${bg};"></span>`)
          .join(" ");
        const wrHtml = wrDots
          .map(([bg, label]) =>
            `${label}<span class="legend-dot" style="background:${bg};"></span>`)
          .join(" ");
        return `
          <span>${t("gsChampions_footer_titles_lbl")}</span> ${titlesHtml} &nbsp;·&nbsp;
          <span>${t("gsChampions_footer_wr_lbl")}</span> ${wrHtml}
        `;
      }

      function buildFooterPrefix() {
        return `
        ${t("gsChampions_footer_1st")} &nbsp;·&nbsp;
        ${t("gsChampions_footer_age")} &nbsp;·&nbsp;
        ${t("gsChampions_footer_span")}
        <br>
        ${t("gsChampions_footer_slams")}
        <br>
        ${t("gsChampions_footer_agg")} &nbsp;·&nbsp;
        ${t("gsChampions_footer_hcg")} &nbsp;·&nbsp;
        ${t("gsChampions_footer_top8")}
        <br>
      `;
      }

      /* ---- 数据加载 ---- */
      async function loadData() {
        try {
          const res = await fetch("../output/tour_gs_champions.json");
          const data = await res.json();
          dataMap = data;
          if (data.meta) {
            minAge = data.meta.min_age;
            maxAge = data.meta.max_age;
          }
          initAgeSelector();
          resetToDefault();
          renderTable();
        } catch (err) {
          console.error("❌ 数据加载失败：", err);
          document.getElementById("table-body").innerHTML =
            `<tr><td colspan="20" style="padding:40px;text-align:center;color:#b91c1c;">${t("load_fail")}</td></tr>`;
        }
      }

      function initAgeSelector() {
        const select = document.getElementById("ageSelect");
        if (!select) return;
        // 翻译 Career 选项
        if (select.options[0]) select.options[0].textContent = t("gsChampions_opt_career");
        while (select.options.length > 1) select.remove(1);
        for (let age = minAge; age <= maxAge; age++) {
          const opt = document.createElement("option");
          opt.value = age;
          opt.textContent = age;
          select.appendChild(opt);
        }
        select.addEventListener("change", (e) => {
          currentAge =
            e.target.value === "career" ? null : parseInt(e.target.value);
          resetToDefault();
          renderTable();
        });
      }

      function getPlayerDataByAge(player, age) {
        if (age === null) return player;
        if (player.age_entries && Array.isArray(player.age_entries)) {
          const entry = player.age_entries.find((e) => e.age === age);
          if (entry) return entry;
          return player.age_entries[player.age_entries.length - 1];
        }
        return player;
      }

      /* ---- 排序 ---- */
      let sortState = [];
      let userSorted = false;

      function slamSortVal(pd, slam) {
        const entry = pd && pd.slam_breakdown ? pd.slam_breakdown[slam] : null;
        if (!entry || !entry.rank) return 0;
        return entry.rank * 1000 + entry.count;
      }

      function getValueByCol(pd, col) {
        if (!pd) return null;
        const map = {
          player: pd.player,
          firstYear: pd.first_year,
          ageFirst: pd.age_first,
          lastYear: pd.last_year,
          ageLast: pd.age_last,
          span: pd.span,
          titles: pd.titles,
          ao: slamSortVal(pd, "AO"),
          rg: slamSortVal(pd, "RG"),
          wim: slamSortVal(pd, "WIM"),
          uso: slamSortVal(pd, "USO"),
          W: pd.W,
          L: pd.L,
          agg: pd.agg,
          hard: pd.win_h,
          clay: pd.win_c,
          grass: pd.win_g,
          h2h_top8_w: pd.h2h_top8_W,
          h2h_top8_l: pd.h2h_top8_L,
          h2h_top8_m: pd.h2h_top8_W != null && pd.h2h_top8_L != null ? pd.h2h_top8_W + pd.h2h_top8_L : null,
        };
        return map[col] ?? null;
      }

      function compareValues(a, b, col, order) {
        if (col !== "player") {
          const dataA = getPlayerDataByAge(a, currentAge);
          const dataB = getPlayerDataByAge(b, currentAge);
          let valA = getValueByCol(dataA, col);
          let valB = getValueByCol(dataB, col);
          const nullA = valA == null,
            nullB = valB == null;
          if (nullA && nullB) return 0;
          if (nullA) return 1;
          if (nullB) return -1;
          valA = Number(valA);
          valB = Number(valB);
          if (valA < valB) return order === "asc" ? -1 : 1;
          if (valA > valB) return order === "asc" ? 1 : -1;
          return 0;
        } else {
          const iocA = a.ioc || "",
            iocB = b.ioc || "";
          const ccA = countryChampionCount.get(iocA) || 0;
          const ccB = countryChampionCount.get(iocB) || 0;
          if (ccA !== ccB) return order === "asc" ? ccA - ccB : ccB - ccA;
          const ttA = countryTotalTitles.get(iocA) || 0;
          const ttB = countryTotalTitles.get(iocB) || 0;
          if (ttA !== ttB) return order === "asc" ? ttA - ttB : ttB - ttA;
          if (iocA < iocB) return order === "asc" ? -1 : 1;
          if (iocA > iocB) return order === "asc" ? 1 : -1;
          return 0;
        }
      }

      function sortRows(rows) {
        if (!sortState.length) return rows;
        return [...rows].sort((a, b) => {
          for (let rule of sortState) {
            const cmp = compareValues(a, b, rule.col, rule.order);
            if (cmp !== 0) return cmp;
          }
          return 0;
        });
      }

      function updateSortIndicators() {
        document.querySelectorAll(".sortable").forEach((th) => {
          const ind = th.querySelector(".sort-indicator");
          if (ind) ind.remove();
        });
        if (!userSorted || !sortState.length) return;
        const primary = sortState[0];
        const th = document.querySelector(`th[data-col="${primary.col}"]`);
        if (th) {
          const span = document.createElement("span");
          span.className = "sort-indicator";
          span.textContent = " " + (primary.order === "asc" ? "▲" : "▼");
          th.appendChild(span);
        }
      }

      function resetToDefault() {
        sortState = [
          { col: "titles", order: "desc" },
          { col: "firstYear", order: "asc" },
          { col: "W", order: "desc" },
        ];
        userSorted = false;
      }

      function handleSortClick(e) {
        const col = e.currentTarget.getAttribute("data-col");
        if (!col) return;
        userSorted = true;
        const idx = sortState.findIndex((s) => s.col === col);
        const newOrder =
          idx !== -1 && sortState[idx].order === "desc" ? "asc" : "desc";
        if (idx !== -1) sortState.splice(idx, 1);
        sortState.unshift({ col, order: newOrder });
        renderTable();
      }

      /* ---- 渲染 ---- */
      function renderTable() {
        const players = dataMap[currentTour] || [];

        countryChampionCount.clear();
        countryTotalTitles.clear();
        for (const p of players) {
          const ioc = p.ioc || "";
          countryChampionCount.set(
            ioc,
            (countryChampionCount.get(ioc) || 0) + 1,
          );
          countryTotalTitles.set(
            ioc,
            (countryTotalTitles.get(ioc) || 0) + (p.titles || 0),
          );
        }

        const sorted = sortRows(players);
        document.getElementById("champion-count").textContent =
          t("gsChampions_champions_count", sorted.length);
        document.getElementById("table-footer").innerHTML =
          buildFooterPrefix() + buildFooterLegend();

        let html = "";
        sorted.forEach((player, idx) => {
          const pd = getPlayerDataByAge(player, currentAge);
          const titlesNum = pd.titles ?? 0;
          const careerTitles = player.titles ?? 0;
          const titleDisplay =
            currentAge === null
              ? careerTitles
              : `${titlesNum} / ${careerTitles}`;

          html += `<tr>
            <td class="col-no">${idx + 1}</td>
            <td class="player-name">
  ${getFlagImg(player.ioc)} ${player.player}${player.active ? '<span class="active-dot" title="Active"></span>' : ''}
  <br><span class="player-dob">(${player.dob}${player.height ? ` · ${player.height}cm` : ''})</span>
</td>
            <td>${pd.first_year ?? "—"}</td>
            <td>${pd.age_first != null ? pd.age_first.toFixed(2) : '—'}</td>
            <td>${pd.last_year ?? "—"}</td>
            <td>${pd.age_last != null ? pd.age_last.toFixed(2) : '—'}</td>
            <td><span class="span-val">${pd.span ?? 0}</span></td>
            <td><span class="${titlesCls(titlesNum)}">${titleDisplay}</span></td>
            <td style="border-left:1px solid var(--border-light);">${slamCellHtml(pd, "AO")}</td>
            <td>${slamCellHtml(pd, "RG")}</td>
            <td>${slamCellHtml(pd, "WIM")}</td>
            <td>${slamCellHtml(pd, "USO")}</td>
            <td class="col-w" style="border-left:1px solid var(--border-light);">${pd.W ?? 0}</td>
            <td class="col-l">${pd.L ?? 0}</td>
            <td class="col-w" style="border-left:1px solid var(--border-light);">${pd.h2h_top8_W ?? '—'}</td>
            <td class="col-l">${pd.h2h_top8_L ?? '—'}</td>
            <td style="border-left:1px solid var(--border-light);"><span class="${aggCls(pd.agg)}">${fmtWinrate(pd.agg)}</span></td>
            <td><span class="${surfCls(pd.win_h)}">${fmtWinrate(pd.win_h)}</span></td>
            <td><span class="${surfCls(pd.win_c)}">${fmtWinrate(pd.win_c)}</span></td>
            <td><span class="${surfCls(pd.win_g)}">${fmtWinrate(pd.win_g)}</span></td>
          </tr>`;
        });

        document.getElementById("table-body").innerHTML =
          html ||
          `<tr><td colspan="20" style="padding:40px;text-align:center;color:var(--text-muted);">${t("gsChampions_no_data")}</td></tr>`;
        updateSortIndicators();
      }

      document.querySelectorAll(".sortable").forEach((th) => {
        th.addEventListener("click", handleSortClick);
      });
      document.getElementById("tourSelect")?.addEventListener("change", (e) => {
        currentTour = e.target.value;
        resetToDefault();
        renderTable();
      });

      loadData();

      const updateEl = document.getElementById("last-updated");
      if (updateEl) updateEl.textContent = "2026-07-13";

      // 监听语言切换事件，重新渲染动态内容
      document.addEventListener("langchange", () => {
        // 重新翻译 Career 选项
        const ageSelect = document.getElementById("ageSelect");
        if (ageSelect?.options[0]) ageSelect.options[0].textContent = t("gsChampions_opt_career");
        // 重新渲染表格（更新图例、冠军计数、无数据提示等）
        renderTable();
      });

      // 页面初始化时应用语言
      applyLang(currentLang);
    </script>
  </div> <!-- /container-fluid -->
</body>

</html>
