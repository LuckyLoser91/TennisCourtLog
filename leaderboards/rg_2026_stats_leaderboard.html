<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1.0, user-scalable=yes, shrink-to-fit=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Player Stats — Roland-Garros 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #0c2f22 0%, #184d33 55%, #0a1b13 100%);
      min-height: 100vh;
      padding: 24px;
      color: #1f2c26;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      color: #f4f7f2;
      margin-bottom: 22px;
      position: relative;
    }

    .header h1 {
      font-size: 2.2em;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 1em;
      opacity: 0.85;
      color: rgba(244, 247, 242, 0.9);
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: absolute;
      left: 0;
      top: 0;
      background: rgba(255, 255, 255, 0.16);
      color: #f4f7f2;
      text-decoration: none;
      font-size: 0.84em;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .home-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .btn-group {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .btn-group button {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 700;
      background: transparent;
      color: rgba(244, 247, 242, 0.88);
      transition: all 0.18s ease;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn-group button.active {
      background: #f4f7f2;
      color: #114429;
      box-shadow: 0 10px 20px rgba(17, 68, 41, 0.12);
    }

    .btn-group button:not(.active):hover {
      background: rgba(255, 255, 255, 0.14);
      color: #f4f7f2;
    }

    /* ── TABLE CARD ── */
    .table-card {
      background: #fbfdfb;
      border: 1px solid rgba(49, 103, 72, 0.14);
      border-radius: 18px;
      overflow: visible;
      box-shadow: 0 24px 60px rgba(5, 20, 12, 0.16);
    }

    .table-wrapper {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 210px);
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
    }

    thead {
      display: table-header-group;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
      min-width: 1200px;
    }

    /* group header row */
    thead tr.group-row th {
      background: #16674c;
      color: #eef6ed;
      font-size: 0.74em;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0 12px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      position: sticky;
      top: 0;
      z-index: 11;
    }

    thead tr.group-row th:last-child {
      border-right: none;
    }

    /* col header row */
    thead tr.col-row th {
      background: #16674c;
      color: #f5faf6;
      padding: 0 12px;
      height: 34px;
      line-height: 34px;
      text-align: center;
      font-weight: 700;
      font-size: 0.76em;
      letter-spacing: 0.06em;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      position: sticky;
      top: 28px;
      z-index: 11;
    }

    thead tr.col-row th:last-child {
      border-right: none;
    }

    thead tr.col-row th.sorted-asc::after {
      content: " ▲";
      font-size: 0.85em;
    }

    thead tr.col-row th.sorted-desc::after {
      content: " ▼";
      font-size: 0.85em;
    }

    /* sticky fixed cols — rowspan=2, total height = 28+34=62px */
    th.col-rank {
      position: sticky;
      left: 0;
      z-index: 20 !important;
      min-width: 46px;
      height: 62px !important;
      vertical-align: middle;
      background: #16674c;
    }

    th.col-name {
      position: sticky;
      left: 46px;
      z-index: 20 !important;
      min-width: 210px;
      height: 62px !important;
      vertical-align: middle;
      text-align: left !important;
      background: #16674c;
    }

    th.col-round {
      position: sticky;
      left: 256px;
      z-index: 20 !important;
      min-width: 78px;
      height: 62px !important;
      vertical-align: middle;
      background: #16674c;
    }

    td.col-rank {
      position: sticky;
      left: 0;
      z-index: 4;
      min-width: 46px;
      text-align: center;
    }

    td.col-name {
      position: sticky;
      left: 46px;
      z-index: 4;
      min-width: 210px;
      text-align: left;
    }

    td.col-round {
      position: sticky;
      left: 256px;
      z-index: 4;
      min-width: 78px;
      text-align: center;
    }

    thead tr.col-row th.fixed-col {
      background: #16674c;
    }

    thead tr.group-row th.g-service {
      background: #16674c;
    }

    thead tr.group-row th.g-return {
      background: #1a5c42;
    }

    thead tr.group-row th.g-points {
      background: #1f6b4a;
    }

    /* group divider */
    th.grp-start,
    td.grp-start {
      border-left: 2px solid rgba(35, 82, 59, 0.16) !important;
    }

    td.grp-start {
      border-left: 2px solid rgba(35, 82, 59, 0.16) !important;
    }

    /* tbody */
    tbody tr {
      border-bottom: 1px solid rgba(17, 80, 51, 0.09);
      transition: background 0.16s ease;
    }

    tbody tr:nth-child(even) {
      background: #f7faf6;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover td {
      background: #e9f7ec !important;
    }

    tbody tr.alive {
      background: #fff;
    }

    tbody tr.eliminated {
      background: #f3f6f2;
      opacity: 0.92;
    }

    td {
      padding: 12px 14px;
      white-space: nowrap;
      text-align: center;
      font-variant-numeric: tabular-nums;
      border-right: 1px solid rgba(17, 80, 51, 0.08);
      transition: background 0.15s ease, color 0.15s ease;
    }

    td:last-child {
      border-right: none;
    }

    /* sticky td bg */
    tbody tr.alive td.col-rank,
    tbody tr.alive td.col-name,
    tbody tr.alive td.col-round {
      background: #fbfdfb;
    }

    tbody tr.alive:hover td.col-rank,
    tbody tr.alive:hover td.col-name,
    tbody tr.alive:hover td.col-round {
      background: #e9f7ec;
    }

    tbody tr.eliminated td.col-rank,
    tbody tr.eliminated td.col-name,
    tbody tr.eliminated td.col-round {
      background: #f3f6f2;
    }

    tbody tr.eliminated:hover td.col-rank,
    tbody tr.eliminated:hover td.col-name,
    tbody tr.eliminated:hover td.col-round {
      background: #e9f7ec;
    }

    .rank-num {
      color: #4c6f5c;
      font-size: 0.85em;
    }

    .player-ranking {
      color: #6d8f82;
      font-size: 0.78em;
      margin-right: 6px;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.98em;
      color: #122f23;
    }

    .alive .player-name {
      color: #153a2a;
    }

    .eliminated .player-name {
      color: #7d8b80;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 7px;
      vertical-align: middle;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    .alive .status-dot {
      background: #2f8a4d;
    }

    .eliminated .status-dot {
      background: #c1c7bd;
    }

    .round-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .alive .round-badge {
      background: #ddf3e0;
      color: #1f5f39;
    }

    .eliminated .round-badge {
      background: #e7ebe5;
      color: #6f7b72;
    }

    .pct-val {
      font-weight: 700;
      color: #143522;
    }

    .pct-frac {
      display: inline-block;
      font-size: 0.76em;
      color: #60786e;
      margin-left: 4px;
    }

    .spd-unit {
      font-size: 0.78em;
      color: #60786e;
      margin-left: 2px;
    }

    .null-val {
      color: #b7c1b8;
    }

    .dr-high {
      color: #1d6b3d;
      font-weight: 700;
    }

    .dr-low {
      color: #a63e2c;
    }

    .state-msg {
      text-align: center;
      padding: 72px 22px;
      color: #f4f7f2;
      font-size: 1.08em;
      opacity: 0.9;
    }

    /* legend */
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .legend-bar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      flex: 1;
      max-width: 240px;
    }

    .legend-label {
      font-size: 0.75em;
      color: rgba(244, 247, 242, 0.86);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>

  <div class="header">
    <a class="home-btn" href="../index.html">← Home</a>
    <h1>🎾 Roland-Garros 2026</h1>
    <p>Women's Singles — Player Statistics</p>
  </div>

  <div id="appRoot">
    <div class="state-msg">Loading…</div>
  </div>

  <script>
    const DATA_PATH = "../output/draw_stats/player_stats.json";
    const PLAYERS_PATH = "../output/draw_stats/players.json";

    const ROUND_ORDER = { R128: 1, R64: 2, R32: 3, R16: 4, QF: 5, SF: 6, F: 7, W: 8 };
    const ROUND_LABEL = { 1: "R128", 2: "R64", 3: "R32", 4: "R16", 5: "QF", 6: "SF", 7: "F", 8: "W" };
    const DR_NEUTRAL = 1.0;

    /* ── Column definitions ── */
    const COLS = [
      // SERVICE
      { key: "_fs_pct", label: "1st Srv %", type: "pct", in: "first_serve_in", total: "first_serve_total", hb: true, group: "service", tip: "1st serve in %" },
      { key: "_w1_pct", label: "Win 1st %", type: "pct", in: "win_1st_in", total: "win_1st_total", hb: true, group: "service", tip: "Win % when 1st serve in" },
      { key: "_w2_pct", label: "Win 2nd %", type: "pct", in: "win_2nd_in", total: "win_2nd_total", hb: true, group: "service", tip: "Win % on 2nd serve" },
      { key: "_ace_pct", label: "Ace %", type: "pct", in: "aces", total: "first_serve_total", hb: true, group: "service", tip: "Aces / 1st serve total" },
      { key: "_df_pct", label: "DF %", type: "pct", in: "double_faults", total: "first_serve_total", hb: false, group: "service", tip: "Double faults / 1st serve total" },
      { key: "max_speed", label: "Max Spd", type: "speed", hb: true, group: "service", tip: "Max serve speed" },
      { key: "serve_1st_avg_speed", label: "1st Avg", type: "speed", hb: true, group: "service", tip: "Avg 1st serve speed" },
      { key: "serve_2nd_avg_speed", label: "2nd Avg", type: "speed", hb: true, group: "service", tip: "Avg 2nd serve speed" },
      // RETURN
      { key: "_r1_pct", label: "Recv 1st %", type: "pct", in: "recv_1st_in", total: "recv_1st_total", hb: true, group: "return", grp: true, tip: "Return pts won on opp 1st serve" },
      { key: "_r2_pct", label: "Recv 2nd %", type: "pct", in: "recv_2nd_in", total: "recv_2nd_total", hb: true, group: "return", tip: "Return pts won on opp 2nd serve" },
      { key: "_bp_pct", label: "BP Conv %", type: "pct", in: "bp_converted_in", total: "bp_converted_total", hb: true, group: "return", tip: "Break points converted %" },
      // POINTS
      { key: "winners", label: "Winners", type: "int", hb: true, group: "points", grp: true, tip: "Total winners" },
      { key: "unforced_errors", label: "UE", type: "int", hb: false, group: "points", tip: "Total unforced errors" },
      { key: "_wue_ratio", label: "W/UE", type: "float", decimals: 2, hb: true, group: "points", tip: "Winners / Unforced Errors" },
      { key: "opp_winners", label: "Opp W", type: "int", hb: false, group: "points", tip: "Opponent total winners" },
      { key: "opp_unforced_errors", label: "Opp UE", type: "int", hb: true, group: "points", tip: "Opponent total unforced errors" },
      { key: "_opp_wue_ratio", label: "Opp W/UE", type: "float", decimals: 2, hb: false, group: "points", tip: "Opponent Winners / Unforced Errors" },
      { key: "_spw_pct", label: "Srv Pts %", type: "pct", in: "_spw_in", total: "_spw_total", hb: true, group: "points", tip: "Serve points won %" },
      { key: "_rpw_pct", label: "Recv %", type: "pct", in: "recv_won_in", total: "recv_won_total", hb: true, group: "points", tip: "Receiving points won %" },
      { key: "_dr", label: "DR", type: "float", decimals: 2, hb: true, group: "points", tip: "Dominance Ratio = Recv% / (1 - SrvPts%)" },
    ];

    const SERVICE_SPAN = 8;
    const RETURN_SPAN = 3;
    const POINTS_SPAN = 9;

    // cols per tab (keys referencing COLS)
    const TAB_KEYS = {
      service: ["_fs_pct", "_w1_pct", "_w2_pct", "_ace_pct", "_df_pct", "max_speed", "serve_1st_avg_speed", "serve_2nd_avg_speed"],
      return: ["_r1_pct", "_r2_pct", "_bp_pct", "_rpw_pct"],
      points: ["winners", "unforced_errors", "_wue_ratio", "opp_winners", "opp_unforced_errors", "_opp_wue_ratio", "_spw_pct", "_rpw_pct", "_dr"],
    };

    /* ── STATE ── */
    let allPlayers = [];
    let filterAlive = true;
    let colTab = "all";
    let sortKey = "name";
    let sortDir = 1;

    /* ── HELPERS ── */
    const safePct = (a, b) => (a != null && b != null && b !== 0) ? a / b : null;
    const fmtPct = v => v == null ? null : Math.round(v * 100) + "%";
    const fmtFrac = (a, b) => (a != null && b != null) ? `${a}/${b}` : "";
    function lerp(a, b, t) { return a + (b - a) * t; }

    function heatColor(t, hb) {
      if (!hb) t = 1 - t;
      if (t >= 0.5) {
        const s = (t - 0.5) * 2;
        return `rgb(${Math.round(lerp(255, 168, s))},${Math.round(lerp(255, 222, s))},${Math.round(lerp(255, 174, s))})`;
      } else {
        const s = t * 2;
        return `rgb(${Math.round(lerp(232, 255, s))},${Math.round(lerp(158, 255, s))},${Math.round(lerp(158, 255, s))})`;
      }
    }

    function minmax(players, key) {
      const vals = players.map(p => p[key]).filter(v => v != null);
      if (!vals.length) return { min: 0, max: 1 };
      return { min: Math.min(...vals), max: Math.max(...vals) };
    }

    function getRoundLabel(p) {
      if (p.is_alive) { const n = (p.rounds_played || 0) + 1; return ROUND_LABEL[n] || ("R" + n); }
      return p.eliminated_round || ROUND_LABEL[p.rounds_played] || "—";
    }

    /* ── ENRICH ── */
    function enrich(players) {
      return players.map(p => {
        const spw_in = (p.win_1st_in || 0) + (p.win_2nd_in || 0);
        const spw_total = (p.win_1st_total || 0) + (p.win_2nd_total || 0);
        const spw_pct = safePct(spw_in, spw_total);
        const rpw_pct = safePct(p.recv_won_in, p.recv_won_total);
        const dr = (spw_pct != null && rpw_pct != null && spw_pct < 1) ? rpw_pct / (1 - spw_pct) : null;
        return {
          ...p,
          _round_label: getRoundLabel(p),
          _round_sort: ROUND_ORDER[getRoundLabel(p)] || 0,
          _fs_pct: safePct(p.first_serve_in, p.first_serve_total),
          _spw_in: spw_in, _spw_total: spw_total, _spw_pct: spw_pct,
          _w1_pct: safePct(p.win_1st_in, p.win_1st_total),
          _w2_pct: safePct(p.win_2nd_in, p.win_2nd_total),
          _ace_pct: safePct(p.aces, p.first_serve_total),
          _df_pct: safePct(p.double_faults, p.first_serve_total),
          _rpw_pct: rpw_pct,
          _r1_pct: safePct(p.recv_1st_in, p.recv_1st_total),
          _r2_pct: safePct(p.recv_2nd_in, p.recv_2nd_total),
          _bp_pct: safePct(p.bp_converted_in, p.bp_converted_total),
          _dr: dr,
          _wue_ratio: (p.winners != null && p.unforced_errors != null && p.unforced_errors !== 0)
            ? Math.round(p.winners / p.unforced_errors * 100) / 100 : null,
          _opp_wue_ratio: (p.opp_winners != null && p.opp_unforced_errors != null && p.opp_unforced_errors !== 0)
            ? Math.round(p.opp_winners / p.opp_unforced_errors * 100) / 100 : null,
          // round speed to integer
          max_speed: p.max_speed != null ? Math.round(p.max_speed) : null,
          serve_1st_avg_speed: p.serve_1st_avg_speed != null ? Math.round(p.serve_1st_avg_speed) : null,
          serve_2nd_avg_speed: p.serve_2nd_avg_speed != null ? Math.round(p.serve_2nd_avg_speed) : null,
        };
      });
    }

    /* ── SORT ── */
    function sorted(players) {
      return [...players].sort((a, b) => {
        if (sortKey === "name") {
          const ar = (a.ranking == null || a.ranking === "") ? null : a.ranking;
          const br = (b.ranking == null || b.ranking === "") ? null : b.ranking;
          if (ar == null && br == null) return 0;
          if (ar == null) return 1;
          if (br == null) return -1;
          return sortDir * (ar - br);
        }
        if (sortKey === "_round_label") {
          const av = a._round_sort, bv = b._round_sort;
          if (av == null && bv == null) return 0;
          if (av == null) return 1; if (bv == null) return -1;
          return sortDir * (av - bv);
        }
        let av = a[sortKey], bv = b[sortKey];
        if (av == null && bv == null) return 0;
        if (av == null) return 1; if (bv == null) return -1;
        return sortDir * (av < bv ? -1 : av > bv ? 1 : 0);
      });
    }

    /* ── RENDER ── */
    function render() {
      const root = document.getElementById("appRoot");
      const visible = filterAlive ? allPlayers.filter(p => p.is_alive) : allPlayers;
      const rows = sorted(visible);

      // filter cols by colTab
      const activeCols = COLS.filter(c =>
        colTab === "all" ? true :
          colTab === "sr" ? (c.group === "service" || c.group === "return") :
            colTab === "points" ? c.group === "points" : true
      );

      // dynamic colspan
      const svcSpan = activeCols.filter(c => c.group === "service").length;
      const retSpan = activeCols.filter(c => c.group === "return").length;
      const ptsSpan = activeCols.filter(c => c.group === "points").length;

      const mm = {};
      activeCols.forEach(c => { mm[c.key] = minmax(rows, c.key); });

      root.innerHTML = `
    <div class="controls">
      <div class="btn-group">
        <button onclick="setFilter(true)"  class="${filterAlive ? 'active' : ''}">Alive Only</button>
        <button onclick="setFilter(false)" class="${!filterAlive ? 'active' : ''}">All Players</button>
      </div>
      <div class="btn-group">
        <button onclick="setColTab('all')"    class="${colTab === 'all' ? 'active' : ''}">All</button>
        <button onclick="setColTab('sr')"     class="${colTab === 'sr' ? 'active' : ''}">S&amp;R</button>
        <button onclick="setColTab('points')" class="${colTab === 'points' ? 'active' : ''}">Points</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr class="group-row">
              <th class="fixed-col col-rank"  rowspan="2">#</th>
              <th class="fixed-col col-name"  rowspan="2" style="text-align:left;padding-left:14px;">PLAYER</th>
              <th class="fixed-col col-round" rowspan="2">ROUND</th>
              ${svcSpan > 0 ? `<th class="g-service" colspan="${svcSpan}">Service</th>` : ""}
              ${retSpan > 0 ? `<th class="g-return"  colspan="${retSpan}">Return</th>` : ""}
              ${ptsSpan > 0 ? `<th class="g-points"  colspan="${ptsSpan}">Points</th>` : ""}
            </tr>
            <tr class="col-row">
              ${activeCols.map(c => {
        const sk = sortKey === c.key;
        const cls = [
          c.grp ? "grp-start" : "",
          `col-${c.key}`,
          sk && sortDir === 1 ? "sorted-asc" : "",
          sk && sortDir === -1 ? "sorted-desc" : "",
        ].filter(Boolean).join(" ");
        return `<th class="${cls}" onclick="setSort('${c.key}')" title="${c.tip || ''}">${c.label}</th>`;
      }).join("")}
            </tr>
          </thead>
          <tbody>
            ${rows.map((p, i) => buildRow(p, i + 1, mm, activeCols)).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="legend">
      <span class="legend-label">low</span>
      <div class="legend-bar" id="legend-bar"></div>
      <span class="legend-label">high</span>
    </div>
  `;

      const bar = document.getElementById("legend-bar");
      bar.innerHTML = Array.from({ length: 20 }, (_, i) =>
        `<div style="flex:1;background:${heatColor(i / 19, true)}"></div>`
      ).join("");
    }

    function buildRow(p, rank, mm, activeCols) {
      const cols = activeCols || COLS;
      const cls = p.is_alive ? "alive" : "eliminated";

      const cells = cols.map(c => {
        const v = p[c.key];
        const cellClass = [
          `col-${c.key}`,
          c.grp ? 'grp-start' : '',
        ].filter(Boolean).join(' ');

        // heatmap bg
        let bg = "";
        if (v != null) {
          const { min, max } = mm[c.key];
          const t = max === min ? 0.5 : (v - min) / (max - min);
          bg = `background:${heatColor(t, c.hb)};`;
        }

        if (c.type === "speed") {
          if (v == null) return `<td class="null-val ${cellClass}">—</td>`;
          return `<td class="${cellClass}" style="${bg}">${Math.round(v)}<span class="spd-unit">km/h</span></td>`;
        }
        if (c.type === "pct") {
          if (v == null) return `<td class="null-val ${cellClass}">—</td>`;
          const inV = p[c.in], tot = p[c.total];
          return `<td class="${cellClass}" style="${bg}">
        <span class="pct-val">${fmtPct(v)}</span>
        <span class="pct-frac">${fmtFrac(inV, tot)}</span>
      </td>`;
        }
        if (c.type === "int") {
          if (v == null) return `<td class="null-val ${cellClass}">—</td>`;
          return `<td class="${cellClass}" style="${bg}">${v}</td>`;
        }
        if (c.type === "float") {
          if (v == null) return `<td class="null-val ${cellClass}">—</td>`;
          const dec = c.decimals ?? 2;
          const drCls = v >= DR_NEUTRAL ? "dr-high" : "dr-low";
          return `<td class="${cellClass} ${drCls}" style="${bg}">${v.toFixed(dec)}</td>`;
        }
        return `<td class="${cellClass}">—</td>`;
      }).join("");

      return `<tr class="${cls}">
    <td class="col-rank"><span class="rank-num">${rank}</span></td>
    <td class="col-name">
      <span class="status-dot"></span>
      ${(p.ranking != null && p.ranking !== "") ? `<span class="player-ranking">#${p.ranking}</span>` : ''}
      <span class="player-name">${p.name}</span>
    </td>
    <td class="col-round"><span class="round-badge">${p._round_label}</span></td>
    ${cells}
  </tr>`;
    }

    /* ── EVENTS ── */
    function setFilter(alive) { filterAlive = alive; render(); }
    function setColTab(tab) { colTab = tab; render(); }
    function setSort(key) {
      if (sortKey === key) { sortDir = -sortDir; }
      else { sortKey = key; sortDir = (key === "name" || key === "_round_label") ? 1 : -1; }
      render();
    }

    /* ── INIT ── */
    async function init() {
      try {
        const [sr, pr] = await Promise.all([
          fetch(DATA_PATH + "?v=" + Date.now(), { cache: "no-store" }),
          fetch(PLAYERS_PATH + "?v=" + Date.now(), { cache: "no-store" }),
        ]);
        if (!sr.ok) throw new Error(`player_stats.json: HTTP ${sr.status}`);
        if (!pr.ok) throw new Error(`players.json: HTTP ${pr.status}`);

        const stats = await sr.json();
        const players = await pr.json();

        const rankMap = {};
        for (const p of players) { if (p.ranking != null) rankMap[p.name] = p.ranking; }

        allPlayers = enrich(stats.map(p => ({ ...p, ranking: rankMap[p.name] ?? null })));
        render();
      } catch (err) {
        document.getElementById("appRoot").innerHTML =
          `<div class="state-msg">❌ Could not load data<br><small style="opacity:0.6">${err.message}</small></div>`;
      }
    }

    init();
  </script>
</body>

</html>
