  <style>
    body {
      min-width: 920px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    h1 {
      font-size: 19px !important;
    }

    .table {
      min-width: 850px;
      width: 100%;
      table-layout: fixed;
      font-size: 13px;
      margin-bottom: 0;
    }

    #table-body td:nth-child(2) {
      text-align: left !important;
      padding-left: 12px !important;
    }

    .table thead tr:first-child th {
      border-bottom: none !important;
      font-size: 10px !important;
      color: #a78b5e;
      padding-bottom: 2px;
    }

    /* Winrate 色块 */
    .wr-cell {
      border-radius: 5px;
      padding: 3px 5px;
      display: inline-block;
      font-weight: 600;
      font-size: 12px;
      min-width: 46px;
      text-align: center;
    }

    .agg-90 {
      background: var(--agg-90-bg);
      color: var(--agg-90-color);
    }

    .agg-85 {
      background: var(--agg-85-bg);
      color: var(--agg-85-color);
    }

    .agg-80 {
      background: var(--agg-80-bg);
      color: var(--agg-80-color);
    }

    .agg-75 {
      background: var(--agg-75-bg);
      color: var(--agg-75-color);
    }

    .agg-70 {
      background: var(--agg-70-bg);
      color: var(--agg-70-color);
    }

    .agg-no {
      color: var(--text-muted);
    }

    .surf-90 {
      background: var(--surf-90-bg);
      color: var(--surf-90-color);
    }

    .surf-85 {
      background: var(--surf-85-bg);
      color: var(--surf-85-color);
    }

    .surf-80 {
      background: var(--surf-80-bg);
      color: var(--surf-80-color);
    }

    .surf-75 {
      background: var(--surf-75-bg);
      color: var(--surf-75-color);
    }

    .surf-70 {
      background: var(--surf-70-bg);
      color: var(--surf-70-color);
    }

    .surf-no {
      color: var(--text-muted);
    }

    /* 强制顶部两行不换行，无视小屏断点 */
    body>.row {
      flex-wrap: nowrap !important;
    }

    body>.row>.col {
      flex: 1 1 auto !important;
      max-width: none !important;
      width: auto !important;
    }

    body>.row>.col-auto {
      flex: 0 0 auto !important;
    }

    body>.row .d-flex.gap-3 {
      flex-wrap: nowrap !important;
    }

    /* checkbox 文字不折行 */
    .form-check-inline {
      white-space: nowrap !important;
    }
  </style>
  <script src="../common/js/i18n.js"></script>

<body>

  <div class="row align-items-center mb-3">
    <div class="col">
      <h1 class="mb-0" data-i18n="nonGsChampions_title">Grand Slam Singles · Non-Champions Leaderboard (Top 100 by Win%,
        Wins &gt; 5)</h1>
    </div>
    <div class="col-auto d-flex gap-2 align-items-center">
      <button class="lang-btn" onclick="applyLang(currentLang === 'en' ? 'zh' : 'en')">中文</button>
      <a href="../index.html" class="btn btn-outline-warning btn-sm" data-i18n="nav_home">HOME</a>
    </div>
  </div>

  <div class="row align-items-center mb-3">
    <div class="col">
      <small class="text-muted">
        <span id="champion-count" class="fw-bold text-warning">0 players</span>
        &nbsp;|&nbsp; <span data-i18n="click_to_sort">Click headers to sort</span>
        &nbsp;|&nbsp; <span data-i18n="last_updated">Last updated:</span> <span id="last-updated"></span>
      </small>
    </div>
    <div class="col-auto">
      <div class="d-flex gap-3 align-items-center">
        <div class="form-check form-check-inline mb-0">
          <input type="checkbox" id="activeOnlyCheckbox" class="form-check-input">
          <label for="activeOnlyCheckbox" class="form-check-label small">
            <span data-i18n="nonGsChampions_label_active">🎾 ACTIVE ONLY (won GS match in last 2 years)</span>
          </label>
        </div>
        <div class="d-flex align-items-center gap-1">
          <label for="tourSelect" class="form-label mb-0 text-nowrap" data-i18n="label_tour">TOUR:</label>
          <select id="tourSelect" class="form-select form-select-sm">
            <option value="wta" selected>WTA</option>
            <option value="atp">ATP</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <table class="table table-hover table-sm mb-0">
    <colgroup>
      <col style="width: 40px;">
      <col style="width: 230px;">
      <col style="width: 60px;">
      <col style="width: 50px;">
      <col style="width: 50px;">
      <col style="width: 50px;">
      <col style="width: 50px;">
      <col style="width: 48px;">
      <col style="width: 48px;">
      <col style="width: 62px;">
      <col style="width: 55px;">
      <col style="width: 55px;">
      <col style="width: 55px;">
      <col style="width: 48px;">
      <col style="width: 48px;">
    </colgroup>
    <thead>
      <tr>
        <th colspan="3"></th>
        <th colspan="4" style="text-align:center; padding-bottom:2px;" data-i18n="nonGsChampions_th_best_result">BEST
          RESULT (BY SLAM)</th>
        <th colspan="2"></th>
        <th colspan="2" style="border-left:1px solid var(--border-main); text-align:center; padding-bottom:2px;"
          data-i18n="nonGsChampions_th_vs_top8">对阵Top8</th>
        <th colspan="4" style="border-left:1px solid var(--border-main); text-align:center; padding-bottom:2px;"
          data-i18n="nonGsChampions_th_winrate">WINRATE</th>
      </tr>
      <tr>
        <th data-i18n="th_no">#</th>
        <th class="sortable" data-col="player" data-i18n="th_player">PLAYER</th>
        <th class="sortable" data-col="best" data-i18n="nonGsChampions_th_best">⭐ BEST</th>
        <th class="sortable" data-col="AO">AO</th>
        <th class="sortable" data-col="RG">RG</th>
        <th class="sortable" data-col="WIM">WIM</th>
        <th class="sortable" data-col="USO">USO</th>
        <th class="sortable" data-col="W" data-i18n="th_w">W</th>
        <th class="sortable" data-col="L" data-i18n="th_l">L</th>
        <th class="sortable" data-col="t8w" style="border-left:1px solid var(--border-main);"
          data-i18n="nonGsChampions_th_t8w">T8 W</th>
        <th class="sortable" data-col="t8l" data-i18n="nonGsChampions_th_t8l">T8 L</th>
        <th class="sortable" data-col="agg" style="border-left:1px solid var(--border-main);" data-i18n="th_agg">AGG
        </th>
        <th class="sortable" data-col="hard" data-i18n="nonGsChampions_th_h">H</th>
        <th class="sortable" data-col="clay" data-i18n="nonGsChampions_th_c">C</th>
        <th class="sortable" data-col="grass" data-i18n="nonGsChampions_th_g">G</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
    <tfoot>
      <tr>
        <td colspan="15" id="table-footer"
          style="padding-top:18px;color:var(--text-muted);font-size:12px;line-height:1.8;border-bottom:none;background:transparent;white-space:normal;">
        </td>
      </tr>
    </tfoot>
  </table>


  <script type="module">
    import { getFlagImg, fmtWinrate, fmtRound } from "../common/js/utils.js?v=202606170751"

    let jsonData = null;
    let currentTour = 'wta';
    let activeOnly = false;
    let sortColumn = 'agg';
    let sortOrder = 'desc';

    function aggCls(pct) {
      if (pct == null) return 'wr-cell agg-no';
      if (pct >= 90) return 'wr-cell agg-90';
      if (pct >= 85) return 'wr-cell agg-85';
      if (pct >= 80) return 'wr-cell agg-80';
      if (pct >= 75) return 'wr-cell agg-75';
      if (pct >= 70) return 'wr-cell agg-70';
      return 'wr-cell agg-no';
    }
    function surfCls(pct) {
      if (pct == null) return 'wr-cell surf-no';
      if (pct >= 90) return 'wr-cell surf-90';
      if (pct >= 85) return 'wr-cell surf-85';
      if (pct >= 80) return 'wr-cell surf-80';
      if (pct >= 75) return 'wr-cell surf-75';
      if (pct >= 70) return 'wr-cell surf-70';
      return 'wr-cell surf-no';
    }

    function isActive(p, maxYear) {
      return p.stats.last_win_year && (maxYear - p.stats.last_win_year) < 2;
    }

    function compareValues(a, b, col) {
      if (col === 'player') {
        const iA = a.ioc || '', iB = b.ioc || '';
        if (iA !== iB) return iA < iB ? -1 : 1;
        return a.player.toLowerCase().localeCompare(b.player.toLowerCase());
      }
      const rankMap = { W: 1, F: 2, SF: 3, QF: 4, R16: 5, R32: 6, R64: 7, R128: 8, '—': 999 };
      if (col === 'best') {
        return (rankMap[a.stats.best_display] || 999) - (rankMap[b.stats.best_display] || 999);
      }
      if (['AO', 'RG', 'WIM', 'USO'].includes(col)) {
        return (rankMap[a.stats[`${col.toLowerCase()}_best`]] || 999) - (rankMap[b.stats[`${col.toLowerCase()}_best`]] || 999);
      }
      const key = { W: 'W', L: 'L', agg: 'agg', hard: 'win_h', clay: 'win_c', grass: 'win_g' }[col];
      if (col === 't8w') {
        const vA = a.stats.vs_top8?.w ?? null, vB = b.stats.vs_top8?.w ?? null;
        if (vA === null && vB === null) return 0;
        if (vA === null) return 1; if (vB === null) return -1;
        return vA - vB;
      }
      if (col === 't8l') {
        const vA = a.stats.vs_top8?.l ?? null, vB = b.stats.vs_top8?.l ?? null;
        if (vA === null && vB === null) return 0;
        if (vA === null) return 1; if (vB === null) return -1;
        return vA - vB;
      }
      const vA = a.stats[key] ?? null, vB = b.stats[key] ?? null;
      if (vA === null && vB === null) return 0;
      if (vA === null) return 1;
      if (vB === null) return -1;
      return vA - vB;
    }

    function sortPlayers(players) {
      return [...players].sort((a, b) => {
        let cmp = compareValues(a, b, sortColumn);
        return sortOrder === 'desc' ? -cmp : cmp;
      });
    }

    function renderTable() {
      if (!jsonData) return;
      let players = jsonData[currentTour] || [];
      if (activeOnly) {
        const maxYear = jsonData.meta.max_years[currentTour];
        players = players.filter(p => isActive(p, maxYear));
      }
      const sorted = sortPlayers(players);
      document.getElementById('champion-count').textContent = t('nonGsChampions_player_count', sorted.length);
      document.getElementById('table-footer').innerHTML = `
        ${t('nonGsChampions_footer_best')} &nbsp;·&nbsp;
        ${t('nonGsChampions_footer_slams')} &nbsp;·&nbsp;
        ${t('nonGsChampions_footer_agg')} &nbsp;·&nbsp; ${t('nonGsChampions_footer_hcg')} &nbsp;·&nbsp;<br>
        ${t('nonGsChampions_footer_wr_label')} ≥70%
        <span style="display:inline-block;width:12px;height:12px;background:var(--agg-70-bg);border-radius:2px;vertical-align:middle;"></span>
        ≥80%
        <span style="display:inline-block;width:12px;height:12px;background:var(--agg-80-bg);border-radius:2px;vertical-align:middle;"></span>
        ≥90%
        <span style="display:inline-block;width:12px;height:12px;background:var(--agg-90-bg);border-radius:2px;vertical-align:middle;"></span>
        ${t('nonGsChampions_footer_color')}`;

      let html = '';
      sorted.forEach((player, idx) => {
        const s = player.stats;
        const dob = player.dob ? ` (${player.dob})` : '';
        html += `<tr>
          <td style="color:var(--text-hint);font-size:11px;">${idx + 1}</td>
          <td style="text-align:left;padding-left:12px;">${getFlagImg(player.ioc)} ${player.player}${dob}</td>
          <td>${fmtRound(s.best_display)}</td>
          <td>${fmtRound(s.ao_best)}</td>
          <td>${fmtRound(s.rg_best)}</td>
          <td>${fmtRound(s.wim_best)}</td>
          <td>${fmtRound(s.uso_best)}</td>
          <td style="color:var(--text-secondary);font-weight:600;">${s.W}</td>
          <td style="color:var(--text-muted);">${s.L}</td>
          <td style="border-left:1px solid var(--border-light);color:var(--text-secondary);font-weight:600;">${s.vs_top8?.w ?? '—'}</td>
          <td style="color:var(--text-muted);">${s.vs_top8?.l ?? '—'}</td>
          <td style="border-left:1px solid var(--border-light);">
            <span class="${aggCls(s.agg)}">${fmtWinrate(Number(s.agg).toFixed(1))}</span>
          </td>
          <td><span class="${surfCls(s.win_h)}">${fmtWinrate(s.win_h)}</span></td>
          <td><span class="${surfCls(s.win_c)}">${fmtWinrate(s.win_c)}</span></td>
          <td><span class="${surfCls(s.win_g)}">${fmtWinrate(s.win_g)}</span></td>
        </tr>`;
      });
      document.getElementById('table-body').innerHTML = html;
      updateSortIndicators();
    }

    function updateSortIndicators() {
      document.querySelectorAll('.sortable').forEach(th => {
        const ind = th.querySelector('.sort-indicator');
        if (ind) ind.remove();
      });
      const th = document.querySelector(`th[data-col="${sortColumn}"]`);
      if (th) {
        const span = document.createElement('span');
        span.className = 'sort-indicator';
        span.textContent = sortOrder === 'asc' ? ' ▲' : ' ▼';
        th.appendChild(span);
      }
    }

    document.querySelectorAll('.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.getAttribute('data-col');
        if (!col) return;
        if (sortColumn === col) sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
        else { sortColumn = col; sortOrder = 'desc'; }
        renderTable();
      });
    });

    document.getElementById('tourSelect').addEventListener('change', e => {
      currentTour = e.target.value; sortColumn = 'agg'; sortOrder = 'desc'; renderTable();
    });
    document.getElementById('activeOnlyCheckbox').addEventListener('change', e => {
      activeOnly = e.target.checked; sortColumn = 'agg'; sortOrder = 'desc'; renderTable();
    });

    async function loadData() {
      try {
        const res = await fetch('../output/tour_non_gs_champions.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        jsonData = await res.json();
        renderTable();
      } catch (err) {
        document.getElementById('table-body').innerHTML =
          `<tr><td colspan="15" style="color:#b91c1c;text-align:center;padding:40px;">${t('load_fail')}</td></tr>`;
      }
    }

    loadData();
    const el = document.getElementById('last-updated');
    if (el) el.textContent = '2026-07-13';

    // 语言切换时重新渲染动态内容
    document.addEventListener('langchange', () => {
      document.title = t('nonGsChampions_page_title');
      renderTable();
    });
  </script>
</body>

</html>
