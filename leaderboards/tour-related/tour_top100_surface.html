  <script type="module">
    import { getFlagImg, fmtWinrate, aggBg, aggColor, surfBg, surfColor, titlesBg, titlesFc } from "../../common/js/utils.js?v=202606170751";

    let allData = [];
    let refDate = null; // 最近更新日期，用作年龄计算基准
    let currentMode = 'career'; // 'career' or 'season'
    let currentTour = 'wta';    // 'wta' or 'atp'

    /* ---- 数据源映射 ---- */
    const TOUR_JSON = {
      wta: "../../output/top100_surface_stats_wta.json",
      atp: "../../output/top100_surface_stats_atp.json",
    };

    /* ---- 页面标题（随 tour 与语言变化） ---- */
    function updateTitle() {
      const el = document.getElementById("pageTitle");
      if (!el) return;
      const tour = currentTour.toUpperCase();
      const isZh = (typeof currentLang !== "undefined" && currentLang === "zh");
      el.textContent = isZh
        ? `🎾 ${tour} 前100 · 场地胜率与冠军 (自2009年)`
        : `🎾 ${tour} Top 100 · Surface Win Rate & Titles (Since 2009)`;
    }

    /* ---- 年龄计算 ---- */
    function calcAge(dob) {
      if (!dob || !refDate) return null;
      const d1 = new Date(dob);
      if (isNaN(d1.getTime())) return null;
      const ageYears = (refDate - d1) / (1000 * 60 * 60 * 24 * 365.25);
      return ageYears.toFixed(2);
    }

    /* ---- 明细标签 ---- */
    function buildBreakdown(titles) {
      if (!titles) return "—";
      const parts = [];
      if (titles.grandSlam) parts.push(`<span class="t-tag t-gs">GS×${titles.grandSlam}</span>`);
      if (titles.yearEndFinals) parts.push(`<span class="t-tag t-finals">Finals×${titles.yearEndFinals}</span>`);
      // WTA 与 ATP 的 1000/500/250 字段名不同，分别兼容
      const t1000 = titles.wta1000 ?? titles.atp1000;
      const t500 = titles.wta500 ?? titles.atp500;
      const t250 = titles.wta250 ?? titles.atp250;
      if (t1000) parts.push(`<span class="t-tag t-1000">1000×${t1000}</span>`);
      if (t500) parts.push(`<span class="t-tag t-500">500×${t500}</span>`);
      if (t250) parts.push(`<span class="t-tag t-250">250×${t250}</span>`);
      if (titles.finals) parts.push(`<span class="t-tag t-elite">Elite×${titles.finals}</span>`);
      return parts.length ? parts.join(" ") : "—";
    }

    /* ---- 胜率分档配色（清晰易读）---- */
    function gradientWr(pct) {
      if (pct == null) return { bg: "transparent", fc: "var(--text-muted)" };
      if (pct >= 80) return { bg: "#14532d", fc: "#bbf7d0" };
      if (pct >= 70) return { bg: "#16a34a", fc: "#ffffff" };
      if (pct >= 60) return { bg: "#fef08a", fc: "#713f12" };
      if (pct >= 50) return { bg: "#fcd34d", fc: "#78350f" };
      return { bg: "#fecaca", fc: "#991b1b" };
    }

    /* ---- 胜率单元格 ---- */
    function wrCell(surf) {
      const pct = surf.pct;
      const c = gradientWr(pct);
      const pctTxt = pct != null ? pct + "%" : "—";
      const wlTxt = surf.total > 0 ? `${surf.w}-${surf.l}` : "";
      return `<span style="display:inline-block;border-radius:5px;padding:3px 8px;background:${c.bg};color:${c.fc};font-weight:600;font-size:13px;min-width:48px;text-align:center;">
          ${pctTxt}${wlTxt ? `<br><span style="font-size:10.5px;opacity:0.8;">${wlTxt}</span>` : ""}
        </span>`;
    }
    /* ---- 冠军数配色 ---- */
    function titlesCell(n) {
      return `<span class="titles-cell" style="background:${titlesBg(n)};color:${titlesFc(n)};">${n}</span>`;
    }

    /* ---- 排序 ---- */
    let sortState = [{ col: "rank", order: "asc" }];
    let userSorted = false;

    function getSortVal(p, col) {
      const modeData = p[currentMode];
      if (!modeData) return null;
      switch (col) {
        case "rank": return p.rank;
        case "name": return p.rank;   // player列点击按rank排序
        case "dob": return p.dateOfBirth ?? "";
        case "height": {
          const h = parseFloat(p.height);
          return isNaN(h) ? -1 : h;
        }
        case "titles": return modeData.titles.total;
        case "agg": return modeData.overall.pct ?? -1;
        case "vs8": return modeData.vsTop8?.pct ?? -1;
        case "hard_pct": return modeData.surface.Hard.pct ?? -1;
        case "clay_pct": return modeData.surface.Clay.pct ?? -1;
        case "grass_pct": return modeData.surface.Grass.pct ?? -1;
        default: return null;
      }
    }

    function sortData(data) {
      return [...data].sort((a, b) => {
        for (const { col, order } of sortState) {
          let va = getSortVal(a, col), vb = getSortVal(b, col);
          if (va == null && vb == null) continue;
          if (va == null) return 1;
          if (vb == null) return -1;
          if (typeof va === "string") {
            const c = va.localeCompare(vb);
            if (c !== 0) return order === "asc" ? c : -c;
          } else {
            if (va < vb) return order === "asc" ? -1 : 1;
            if (va > vb) return order === "asc" ? 1 : -1;
          }
        }
        return 0;
      });
    }

    function updateSortIndicators() {
      document.querySelectorAll(".sortable").forEach(th => {
        th.querySelector(".sort-indicator")?.remove();
      });
      if (!userSorted || !sortState.length) return;
      const { col, order } = sortState[0];
      const th = document.querySelector(`th[data-col="${col}"]`);
      if (th) {
        const sp = document.createElement("span");
        sp.className = "sort-indicator";
        sp.textContent = " " + (order === "asc" ? "▲" : "▼");
        th.appendChild(sp);
      }
    }

    document.querySelectorAll(".sortable").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.getAttribute("data-col");
        userSorted = true;
        const idx = sortState.findIndex(s => s.col === col);
        const newOrder = idx !== -1 && sortState[idx].order === "desc" ? "asc" : "desc";
        if (idx !== -1) sortState.splice(idx, 1);
        sortState.unshift({ col, order: newOrder });
        renderTable();
      });
    });

    /* ---- HTML 转义 ---- */
    function pmEsc(s) {
      if (s == null) return "";
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    /* ---- 渲染 ---- */
    function renderTable() {
      const sorted = sortData(allData);
      document.getElementById("player-count").textContent = t("top100Surface_player_count", sorted.length);

      let html = "";
      sorted.forEach((p, idx) => {
        const modeData = p[currentMode];
        if (!modeData) return;
        const titles = modeData.titles;
        const overall = modeData.overall;
        const surface = modeData.surface;
        const vsTop8 = modeData.vsTop8;
        const hard = surface.Hard;
        const clay = surface.Clay;
        const grass = surface.Grass;
        const heightTxt = (p.height != null && String(p.height).trim() !== "")
          ? `${p.height}`
          : "—";

        html += `<tr data-player="${pmEsc(p.fullName)}">
            <td class="col-no">${idx + 1}</td>
            <td class="td-player">
              ${getFlagImg(p.countryCode)}<span class="col-rank">#${p.rank}</span> ${p.fullName}
            </td>
            <td style="color:var(--text-primary);font-size:12.5px;white-space:nowrap;">
              ${p.dateOfBirth ?? "—"}${calcAge(p.dateOfBirth) !== null ? ` (${calcAge(p.dateOfBirth)})` : ""}
            </td>
            <td class="td-height">${heightTxt}</td>
            <td style="font-weight:600; text-align:center;">${titles.total || 0}</td>

            <td class="surf-sep">${wrCell({ pct: overall.pct, w: overall.w, l: overall.l, total: overall.total })}</td>

            <td>${vsTop8 && vsTop8.total > 0 ? wrCell(vsTop8) : `<span style="color:var(--text-muted);">—</span>`}</td>

            <td class="surf-sep">${wrCell(hard)}</td>
            <td class="td-breakdown">${buildBreakdown(hard.titles)}</td>

            <td class="surf-sep">${wrCell(clay)}</td>
            <td class="td-breakdown">${buildBreakdown(clay.titles)}</td>

            <td class="surf-sep">${wrCell(grass)}</td>
            <td class="td-breakdown">${buildBreakdown(grass.titles)}</td>
          </tr>`;
      });

      document.getElementById("table-body").innerHTML = html ||
        `<tr><td colspan="13" style="padding:40px;text-align:center;color:var(--text-muted);">${t("top100Surface_no_data")}</td></tr>`;
      updateSortIndicators();
      renderFooter();
    }

    /* ---- 脚注 ---- */
    function renderFooter() {
      const wrDots = [
        ["#14532d", "#bbf7d0", "≥80%"],
        ["#16a34a", "#ffffff", "≥70%"],
        ["#fef08a", "#713f12", "≥60%"],
        ["#fcd34d", "#78350f", "≥50%"],
        ["#fecaca", "#991b1b", "<50%"],
      ];
      const wrHtml = wrDots.map(([bg, fc, lbl]) =>
        `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:6px;">` +
        `<span class="legend-dot" style="background:${bg};"></span>${lbl}</span>`
      ).join("");
      document.getElementById("table-footer").innerHTML =
        `<span>${t("top100Surface_footer_wr_lbl")}</span> ${wrHtml}`;
    }

    /* ---- 加载数据 ---- */
    async function loadData() {
      const body = document.getElementById("table-body");
      body.innerHTML = `<tr><td colspan="13" style="padding:40px;text-align:center;color:var(--text-muted);">Loading…</td></tr>`;
      try {
        const url = TOUR_JSON[currentTour] || TOUR_JSON.wta;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        allData = json.data || [];
        const ts = json.generated_at;
        const dt = new Date(ts * 1000);
        refDate = dt;
        document.getElementById("last-updated").textContent =
          dt.toISOString().slice(0, 10);
        updateTitle();
        renderTable();
      } catch (err) {
        console.error("Load failed:", err);
        allData = [];
        body.innerHTML =
          `<tr><td colspan="13" style="padding:40px;text-align:center;color:#b91c1c;">${t("load_fail")}</td></tr>`;
        document.getElementById("player-count").textContent = "—";
      }
    }

    // 数据模式切换监听
    document.getElementById("modeSelect")?.addEventListener("change", (e) => {
      currentMode = e.target.value;
      renderTable();
    });

    // 巡回赛切换监听
    document.getElementById("tourSelect")?.addEventListener("change", (e) => {
      currentTour = e.target.value;
      pmCache = {};
      closePMModal();
      updateTitle();
      loadData();
    });

    loadData();

    document.addEventListener("langchange", () => {
      updateTitle();
      renderTable();
      const backdrop = document.getElementById("pm-backdrop");
      if (backdrop && backdrop.classList.contains("open") && pmCurrentPlayer) {
        pmRefreshLabels();
        loadAndRenderPMModal();
      }
    });
    applyLang(currentLang);

    /* ============================================================
       Player Matches Modal
       ============================================================ */
    let pmCurrentPlayer = null;
    let pmCache = {};

    function pmT(key, fallback) {
      try {
        if (typeof t === "function") {
          const v = t(key);
          if (v && v !== key) return v;
        }
      } catch (e) { }
      return fallback;
    }

    const PM_ROUND_ORDER = {
      RR: 0, R128: 1, R64: 2, R32: 3, R16: 4, QF: 5, SF: 6, F: 7,
    };

    function pmLevelBadgeClass(label) {
      if (!label) return "pm-lvl-other";
      const l = label.toLowerCase();
      if (l.includes("grand slam")) return "pm-lvl-GrandSlam";
      if (l.includes("finals")) return "pm-lvl-Finals";
      if (l.includes("1000") || l.includes("masters")) return "pm-lvl-1000";
      if (l.includes("500")) return "pm-lvl-500";
      if (l.includes("250")) return "pm-lvl-250";
      return "pm-lvl-other";
    }
    function pmSurfaceBadgeClass(surface) {
      if (!surface) return "pm-surface-other";
      const s = surface.toLowerCase();
      if (s.includes("hard")) return "pm-surface-Hard";
      if (s.includes("clay")) return "pm-surface-Clay";
      if (s.includes("grass")) return "pm-surface-Grass";
      if (s.includes("carpet")) return "pm-surface-Carpet";
      return "pm-surface-other";
    }

    function pmBuildModeOptions() {
      const currentYear = new Date().getFullYear();
      const careerLabel = pmT("surface_modal_career", "Career");
      const opts = [`<option value="career">${careerLabel}</option>`];
      for (let y = currentYear; y >= 2009; y--) {
        opts.push(`<option value="${y}">${y}</option>`);
      }
      return opts.join("");
    }

    function pmRefreshLabels() {
      const titleEl = document.getElementById("pm-title");
      if (titleEl) titleEl.textContent = pmCurrentPlayer || "";
      const modeLabel = document.getElementById("pm-mode-label");
      if (modeLabel) modeLabel.textContent = pmT("surface_modal_mode", "MODE");
      const closeBtn = document.getElementById("pm-close-btn");
      if (closeBtn) closeBtn.textContent = pmT("surface_modal_close", "Close");
    }

    function openPlayerMatchesModal(playerName) {
      if (!playerName) return;
      pmCurrentPlayer = playerName;

      const backdrop = document.getElementById("pm-backdrop");
      const modeSelect = document.getElementById("pm-mode-select");
      const contentEl = document.getElementById("pm-content");
      const noDataEl = document.getElementById("pm-no-data");
      const subEl = document.getElementById("pm-sub");
      if (!backdrop || !modeSelect) return;

      pmRefreshLabels();
      modeSelect.innerHTML = pmBuildModeOptions();

      // 主页面 Career / Season 决定 Modal 默认值
      if (currentMode === "career") {
        modeSelect.value = "career";
      } else {
        modeSelect.value = String(new Date().getFullYear());
      }

      contentEl.innerHTML = "";
      noDataEl.style.display = "none";
      subEl.textContent = "";
      backdrop.classList.add("open");

      modeSelect.onchange = loadAndRenderPMModal;
      loadAndRenderPMModal();
    }

    function closePMModal() {
      const backdrop = document.getElementById("pm-backdrop");
      if (backdrop) backdrop.classList.remove("open");
    }

    async function loadAndRenderPMModal() {
      const select = document.getElementById("pm-mode-select");
      const contentEl = document.getElementById("pm-content");
      const noDataEl = document.getElementById("pm-no-data");
      const subEl = document.getElementById("pm-sub");
      if (!select || !contentEl) return;

      const val = select.value;
      let mode, year;
      if (val === "career") {
        mode = "career";
        year = null;
      } else {
        mode = "season";
        year = parseInt(val, 10);
      }

      contentEl.innerHTML =
        `<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;">` +
        `${pmT("loading", "Loading…")}</div>`;
      noDataEl.style.display = "none";

      const cacheKey = `${currentTour}|${pmCurrentPlayer}|${mode}|${year || ""}`;
      let data = pmCache[cacheKey];

      if (!data) {
        try {
          const params = new URLSearchParams();
          params.set("player", pmCurrentPlayer);
          params.set("tour", currentTour);
          params.set("mode", mode);
          if (mode === "season") params.set("year", String(year));
          const res = await fetch("/api/player_matches?" + params.toString());
          data = await res.json();
          pmCache[cacheKey] = data;
        } catch (err) {
          contentEl.innerHTML = "";
          noDataEl.textContent = pmT("load_fail", "Failed to load data");
          noDataEl.style.display = "block";
          subEl.textContent = "";
          return;
        }
      }

      if (!data || data.error || !data.matches || data.matches.length === 0) {
        contentEl.innerHTML = "";
        noDataEl.textContent = pmT("surface_modal_no_data", "No match data available");
        noDataEl.style.display = "block";
        subEl.textContent = "";
        return;
      }

      const wins = data.wins || 0;
      const losses = data.losses || 0;
      const total = data.total_matches || 0;
      const wr = wins + losses > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) : "0.0";
      subEl.textContent =
        `${total} ${pmT("surface_modal_matches", "matches")} · ${wr}% (${wins}W ${losses}L)`;

      contentEl.innerHTML = pmRenderContent(data, mode);
    }

    function pmRenderContent(data, mode) {
      const matches = data.matches;

      if (mode === "career") {
        const byYear = new Map();
        for (const m of matches) {
          if (!byYear.has(m.year)) byYear.set(m.year, []);
          byYear.get(m.year).push(m);
        }
        const years = [...byYear.keys()].sort((a, b) => b - a);
        let html = "";
        for (const y of years) {
          const group = byYear.get(y);
          const yWins = group.filter(m => m.result === "W").length;
          const yLosses = group.filter(m => m.result === "L").length;
          const yWr =
            yWins + yLosses > 0 ? ((yWins / (yWins + yLosses)) * 100).toFixed(1) : "0.0";
          html += `<div class="pm-year-hdr">
        <span class="pm-year-label">${y}</span>
        <span class="pm-year-meta">${yWins}W-${yLosses}L · ${yWr}%</span>
      </div>`;
          html += pmRenderTourneyGroups(group);
        }
        return html;
      }
      return pmRenderTourneyGroups(matches);
    }

    function pmRenderTourneyGroups(matches) {
      const groups = new Map();
      for (const m of matches) {
        const key = m.tourney_name || "Unknown";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(m);
      }

      let html = "";
      for (const [name, group] of groups) {
        const sorted = [...group].sort((a, b) => {
          const d = (a.tourney_date || "").localeCompare(b.tourney_date || "");
          if (d !== 0) return d;
          return (PM_ROUND_ORDER[a.round] || 0) - (PM_ROUND_ORDER[b.round] || 0);
        });
               const first = sorted[0];
        const levelLabel = first.level_label || "";
        const surface = first.surface || "";
        const badgeCls = pmLevelBadgeClass(levelLabel);
        const surfaceCls = pmSurfaceBadgeClass(surface);

        html += `<div class="pm-tourney-hdr">
      <span class="pm-tourney-name">${pmEsc(name)}</span>
      ${levelLabel ? `<span class="pm-tourney-badge ${badgeCls}">${pmEsc(levelLabel)}</span>` : ""}
      ${surface ? `<span class="pm-tourney-surface ${surfaceCls}">${pmEsc(surface)}</span>` : ""}
    </div>`;

               html += `<table class="pm-tbl">
      <colgroup>
        <col style="width:108px">
        <col style="width:62px">
        <col style="width:44px">
        <col>
        <col style="width:140px">
      </colgroup>
      <tbody>`;

        for (const m of sorted) {
          const isWin = m.result === "W";
          const opp = m.opponent_rank
            ? `#${m.opponent_rank} ${m.opponent}`
            : (m.opponent || "—");
          const date = (m.tourney_date || "").slice(0, 10);
          html += `<tr>
        <td class="tleft pm-date">${pmEsc(date || "—")}</td>
        <td class="tleft"><span class="pm-rd">${pmEsc(m.round || "—")}</span></td>
        <td style="text-align:center"><span class="${isWin ? "pm-badge-w" : "pm-badge-l"}">${m.result}</span></td>
        <td class="tleft bold">${pmEsc(opp)}</td>
        <td class="pm-score" style="text-align:center">${pmEsc(m.score || "—")}</td>
      </tr>`;
        }

        html += `</tbody></table>`;
      }
      return html;
    }

    /* ---- Modal 事件绑定 ---- */
    document.getElementById("pm-close")?.addEventListener("click", closePMModal);
    document.getElementById("pm-close-btn")?.addEventListener("click", closePMModal);
    document.getElementById("pm-backdrop")?.addEventListener("click", (e) => {
      if (e.target === e.currentTarget) closePMModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePMModal();
    });

    /* ---- 双击行打开 Modal ---- */
    document.getElementById("table-body")?.addEventListener("dblclick", (e) => {
      const tr = e.target.closest("tr[data-player]");
      if (!tr) return;
      const name = tr.dataset.player;
      if (name) openPlayerMatchesModal(name);
    });

    /* ---- 移动端：单击球员单元格打开 Modal ---- */
    if (window.matchMedia("(pointer: coarse)").matches) {
      document.getElementById("table-body")?.addEventListener("click", (e) => {
        const td = e.target.closest("td.td-player");
        if (!td) return;
        const tr = td.closest("tr[data-player]");
        if (!tr) return;
        const name = tr.dataset.player;
        if (name) openPlayerMatchesModal(name);
      });
    }
  </script>
</body>

</html>
